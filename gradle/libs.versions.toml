# Version catalog is a central place for you to declare and version dependencies
# https://docs.gradle.org/current/userguide/platforms.html#sub:version-catalog
# https://docs.gradle.org/current/userguide/platforms.html#sub::toml-dependencies-format

[versions]
kotlin = "2.4.21"
java = "17"
kotlinxDatetime = "0.8.0"
kotlinxSerializationJSON = "1.12.0"
kotlinxCoroutines = "1.11.0"
# NOTE: Quarkus 3.27-3.30.1 had a regression ignoring ConfigSource ordinal for
# mp.messaging.*.connector properties. Fixed in 3.30.6.
quarkus = "3.40.1.2"
smallryeReactiveMessagingInMemory = "4.37.1"
# Keep the DSL contract until Lemline supports the newer SDK's workflow format.
serverlessworkflow = "7.0.0.Final"
uuidCreator = "6.1.1"
javaSemver = "0.10.2"
ktor = "3.6.1"
jackson = "2.23.0"
kotest = "6.2.6"
mockk = "1.14.12"
testcontainers = "2.0.5"
spotless = "8.11.0"
cloudevents = "5.1.0"
smallryeReactiveMessagingApi = "4.37.1"
wire = "7.2.0"

[libraries]
spotlessPlugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
kotlinGradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlinxDatetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinxDatetime" }
kotlinxSerializationJson = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJSON" }
kotlinxCoroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinxCoroutinesTest = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
kotlinxCoroutinesReactive = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-reactive", version.ref = "kotlinxCoroutines" }
kotlinxCoroutinesSlf4j = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-slf4j", version.ref = "kotlinxCoroutines" }
quarkus-bom = { group = "io.quarkus", name = "quarkus-bom", version.ref = "quarkus" }
quarkus-amazon-services-bom = { group = "io.quarkus.platform", name = "quarkus-amazon-services-bom", version.ref = "quarkus" }
smallrye-reactive-messaging-inmemory = { module = "io.smallrye.reactive:smallrye-reactive-messaging-in-memory", version.ref = "smallryeReactiveMessagingInMemory" }
serverlessworkflow-api = { module = "io.serverlessworkflow:serverlessworkflow-api", version.ref = "serverlessworkflow" }
serverlessworkflow-impl-core = { module = "io.serverlessworkflow:serverlessworkflow-impl-core", version.ref = "serverlessworkflow" }
uuidCreator = { module = "com.github.f4b6a3:uuid-creator", version.ref = "uuidCreator" }
javaSemver = { module = "com.github.zafarkhaja:java-semver", version.ref = "javaSemver" }
ktor-bom = { module = "io.ktor:ktor-bom", version.ref = "ktor" }
jackson-bom = { module = "com.fasterxml.jackson:jackson-bom", version.ref = "jackson" }
kotest-bom = { module = "io.kotest:kotest-bom", version.ref = "kotest" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
cloudevents-core = { module = "io.cloudevents:cloudevents-core", version.ref = "cloudevents" }
cloudevents-json-jackson = { module = "io.cloudevents:cloudevents-json-jackson", version.ref = "cloudevents" }
smallrye-reactive-messaging-api = { module = "io.smallrye.reactive:smallrye-reactive-messaging-api", version.ref = "smallryeReactiveMessagingApi" }
wire-runtime = { module = "com.squareup.wire:wire-runtime", version.ref = "wire" }
wire-moshi-adapter = { module = "com.squareup.wire:wire-moshi-adapter", version.ref = "wire" }

# Libraries bundled together for easier import
[bundles]
kotlinxEcosystem = ["kotlinxDatetime", "kotlinxSerializationJson", "kotlinxCoroutines"]

[plugins]
kotlinPluginSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
quarkus = { id = "io.quarkus", version.ref = "quarkus" }
wire = { id = "com.squareup.wire", version.ref = "wire" }
