server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Gateway calls go through the dashboard origin, so the dashboard works on any host port
  # without a CORS rule for it. Long timeouts keep the change streams open.
  location /lemline.gateway.v1.GatewayService/ {
    proxy_pass http://grpc-web-proxy:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /config.js {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }
}
