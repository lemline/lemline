# ---------------------------------------------------------------------
# Application configuration
# ---------------------------------------------------------------------
quarkus.application.name=lemline
quarkus.banner.enabled=false
quarkus.devservices.enabled=false


# ---------------------------------------------------------------------
# Native image configuration
# ---------------------------------------------------------------------
# Native image build arguments
%native.quarkus.native.enabled=true
%native.quarkus.package.jar.enabled=false
# Increase memory for native image build
quarkus.native.native-image-xmx=8g
# Reduce the size of the native image binary
# quarkus.native.compression.level=8
# Additional build arguments for the native image
quarkus.native.additional-build-args=\
--verbose,\
--report-unsupported-elements-at-runtime,\
--initialize-at-run-time=com.github.f4b6a3.uuid
# Disable Vert.x file caching to avoid directory creation issues in native images
# (fixes "Unable to create folder at path '/var/folders/.../vertx-cache'" error)
vertx.disableFileCaching=true

# ---------------------------------------------------------------------
# Ensure these external libs are indexed by Quarkus (Jandex) For Native Compilation
# Do not remove this; it is required for native execution
# ---------------------------------------------------------------------
quarkus.index-dependency.agroal.group-id=io.agroal
quarkus.index-dependency.agroal.artifact-id=agroal-api
quarkus.index-dependency.mp-config.group-id=org.eclipse.microprofile.config
quarkus.index-dependency.mp-config.artifact-id=microprofile-config-api
quarkus.index-dependency.jackson-jq.group-id=net.thisptr
quarkus.index-dependency.jackson-jq.artifact-id=jackson-jq
quarkus.index-dependency.jboss-logging.group-id=org.jboss.logging
quarkus.index-dependency.jboss-logging.artifact-id=jboss-logging
quarkus.index-dependency.serverlessworkflow.group-id=io.serverlessworkflow
quarkus.index-dependency.serverlessworkflow.artifact-id=serverlessworkflow-api
# Note: Warning about KTypeProjection not in Jandex index is harmless - array types are JVM-synthesized
quarkus.index-dependency.kotlin-reflect.group-id=org.jetbrains.kotlin
quarkus.index-dependency.kotlin-reflect.artifact-id=kotlin-reflect
# SmallRye Reactive Messaging provider (for connector base classes and discovery)
quarkus.index-dependency.smallrye-messaging.group-id=io.smallrye.reactive
quarkus.index-dependency.smallrye-messaging.artifact-id=smallrye-reactive-messaging-provider
# PGMQ messaging connector module
quarkus.index-dependency.pgmq-messaging.group-id=com.lemline
quarkus.index-dependency.pgmq-messaging.artifact-id=lemline-runner-messaging-pgmq

# ---------------------------------------------------------------------
# Logging configuration
# ---------------------------------------------------------------------
quarkus.log.level=ERROR
quarkus.log.console.level=ERROR
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5p [%X{workflowNamespace}/%X{workflowName}:%X{workflowVersion}] [%X{workflowId}] [%c{2.}] %s%e%n
quarkus.log.console.json=false
quarkus.console.color=true

# ---------------------------------------------------------------------
# Database Default Settings
# ---------------------------------------------------------------------
%prod.quarkus.datasource.jdbc=false
%dev.quarkus.datasource.jdbc=false
# H2 datasource
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:lemline;DB_CLOSE_DELAY=-1
quarkus.datasource.username=sa
quarkus.datasource.password=sa
quarkus.datasource.active=true
quarkus.flyway.locations=classpath:db/migration/h2/
# Postgresql datasource
quarkus.datasource.postgresql.db-kind=postgresql
quarkus.datasource.postgresql.jdbc.url=jdbc:postgresql://localhost:5432/lemline
quarkus.datasource.postgresql.username=postgres
quarkus.datasource.postgresql.password=postgres
quarkus.datasource.postgresql.active=true
quarkus.flyway.postgresql.locations=classpath:db/migration/postgresql/
# Mysql datasource
quarkus.datasource.mysql.db-kind=mysql
quarkus.datasource.mysql.jdbc.url=jdbc:mysql://localhost:3306/lemline
quarkus.datasource.mysql.username=mysql
quarkus.datasource.mysql.password=mysql
quarkus.datasource.mysql.active=true
quarkus.flyway.mysql.locations=classpath:db/migration/mysql/

# ---------------------------------------------------------------------
# Messaging Default Settings
# ---------------------------------------------------------------------
# Default to in-memory connector for all channels.
# LemlineConfigSource (ordinal 275) will override these with the user's
# configured backend (Kafka, RabbitMQ, PGMQ) when specified.
#
# NOTE: These defaults must be present for tests and development mode.
mp.messaging.incoming.commands-in.connector=smallrye-in-memory
mp.messaging.outgoing.commands-out.connector=smallrye-in-memory
mp.messaging.outgoing.commands-out.merge=true

mp.messaging.incoming.events-in.connector=smallrye-in-memory
mp.messaging.outgoing.events-out.connector=smallrye-in-memory
mp.messaging.outgoing.events-out.merge=true

mp.messaging.incoming.cloudevents-in.connector=smallrye-in-memory
mp.messaging.outgoing.cloudevents-out.connector=smallrye-in-memory
mp.messaging.outgoing.cloudevents-out.merge=true

mp.messaging.outgoing.lifecycleevents-out.connector=smallrye-in-memory

# ---------------------------------------------------------------------
# Metrics Default Settings
# ---------------------------------------------------------------------
quarkus.micrometer.enabled=true
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/q/metrics

# ---------------------------------------------------------------------
# Health Check Default Settings
# ---------------------------------------------------------------------
quarkus.smallrye-health.enabled=false
quarkus.smallrye-health.root-path=/health
quarkus.smallrye-health.liveness-path=/health/live
quarkus.smallrye-health.readiness-path=/health/ready
