# ---------------------------------------------------------------------
# Test Configuration Overrides
#
# Properties defined here override those in src/main/resources/application.properties
# Only define properties that need a DIFFERENT value for tests.
# ---------------------------------------------------------------------

# Testcontainers owns JVM-lived Ryuk/Docker threads and static state. Share its core
# across Quarkus profiles instead of keeping one runtime classloader alive per profile.
# Keep its transitive dependencies parent-first too, to avoid cross-loader linkage errors.
quarkus.class-loading.parent-first-artifacts=org.testcontainers:testcontainers,\
  junit:junit,org.hamcrest:hamcrest-core,org.slf4j:slf4j-api,\
  org.apache.commons:commons-compress,commons-codec:commons-codec,commons-io:commons-io,\
  org.apache.commons:commons-lang3,org.rnorth.duct-tape:duct-tape,org.jetbrains:annotations,\
  com.github.docker-java:docker-java-api,com.github.docker-java:docker-java-transport,\
  com.github.docker-java:docker-java-transport-zerodep,\
  com.fasterxml.jackson.core:jackson-annotations,net.java.dev.jna:jna

# ---------------------------------------------------------------------
# Kafka Default Configuration Overridden for Tests
# ---------------------------------------------------------------------
# Quarkus 3.30 sets producer close-timeout=0 in tests when graceful shutdown is disabled.
# SmallRye 4.31 rejects that timeout before closing the native client, leaking its network
# thread and the profile's classloader. Keep the normal shutdown path for all Kafka channels.
quarkus.messaging.kafka.enable-graceful-shutdown-in-dev-and-test-mode=true

# Note: Connection details (brokers, hostname, port, user, pass, etc.) inherit from main application.properties
#       These are typically overridden by Testcontainers anyway.
#lemline.messaging.kafka.topic=test-commands-in
#lemline.messaging.kafka.topic-out=test-commands-out

# ---------------------------------------------------------------------
# RabbitMQ Default Configuration Overridden for Tests
#
# NOTE: This section is commented out by default to prevent build failures.
# The validation rules enforce that only one messaging system (Kafka or RabbitMQ)
# can be configured at a time. To run RabbitMQ-specific tests, you should
# create a dedicated Quarkus Test Profile that enables this configuration.
# ---------------------------------------------------------------------
# lemline.messaging.rabbitmq.hostname=localhost
# lemline.messaging.rabbitmq.queue=test-commands-in
# lemline.messaging.rabbitmq.queue-out=test-commands-out

# ---------------------------------------------------------------------
# Quarkus Configuration Overrides for Tests
# ---------------------------------------------------------------------
# Use random available port for metrics HTTP server to avoid port conflicts in parallel tests
quarkus.http.test-port=0

# Override logging levels for more verbose test output
quarkus.test.profile=test
quarkus.log.level=WARN
quarkus.log.console.level=DEBUG
quarkus.log.category."com.lemline".level=DEBUG
quarkus.log.category."com.lemline.core".level=DEBUG
quarkus.log.category."com.lemline.runner".level=INFO
quarkus.log.category."com.lemline.runner.messaging".level=INFO
quarkus.log.category."com.lemline.runner.cli".level=INFO
quarkus.log.category."com.lemline.runner.definitions".level=INFO
quarkus.log.category."com.lemline.runner.listeners".level=DEBUG
quarkus.log.category."com.lemline.runner.forks".level=INFO
quarkus.log.category."com.lemline.runner.parents".level=INFO
quarkus.log.category."com.lemline.runner.retries".level=INFO
quarkus.log.category."com.lemline.runner.schedules".level=INFO
quarkus.log.category."com.lemline.runner.waits".level=INFO
# Quarkus configuration
# quarkus.log.category."io.quarkus.config".level=DEBUG
# Flyway logging
# quarkus.log.category."org.flywaydb".level=DEBUG
# RabbitMQ Logging
# quarkus.log.category."com.rabbitmq".level=DEBUG
# quarkus.log.category."io.smallrye.reactive.messaging.rabbitmq".level=DEBUG
# quarkus.log.category."io.smallrye.config".level=DEBUG
# Database and datasource logging
# quarkus.log.category."io.agroal".level=DEBUG
# Note: Other quarkus properties (log format, console color, etc.) inherit from main application.properties
# Disable JSON logging for tests - use human-readable format
quarkus.log.console.json=false
lemline.outbox.enabled=false
