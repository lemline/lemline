document:
  dsl: "1.0.3"
  namespace: sample
  name: event-listener
  version: "1.0.0"
  title: Event Listener Template
input:
  schema:
    document:
      type: array
      minItems: 1
      items:
        type: object
        required: [orderId]
        properties:
          orderId: {type: string, minLength: 1}
schedule:
  "on":
    one:
      with:
        type: com.example.order.created.v1
do:
  - waitForApproval:
      listen:
        to:
          one:
            with:
              type: com.example.order.approved.v1
              data: ${ .approved == true }
            correlate:
              order:
                from: ${ .orderId }
                expect: ${ $workflow.input[0].orderId }
        read: data
  - emitApprovedEvent:
      emit:
        event:
          with:
            source: https://workflows.example.com/order
            type: com.example.workflow.order.approved.v1
            data: '${ {approvalEvents: .} }'
