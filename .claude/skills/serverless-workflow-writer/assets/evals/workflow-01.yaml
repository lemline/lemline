document:
  dsl: "1.0.3"
  namespace: commerce
  name: order-confirmation
  version: "1.0.0"
  title: Order Confirmation
use:
  retries:
    transientHttp:
      limit:
        attempt:
          count: 4
      # HTTP status failures carry the status in the title; transport errors retain their exception class.
      when: >-
        ${ (($error.title // "") | test("^HTTP (408|429|502|503|504):")) or
           (($error.details // "") | test("^(java[.]net[.](ConnectException|SocketException|SocketTimeoutException)|io[.]ktor[.]client[.](plugins[.]HttpRequestTimeoutException|network[.]sockets[.](ConnectTimeoutException|SocketTimeoutException)))(:|$)")) }
      delay: PT2S
      backoff:
        exponential: {}
  timeouts:
    externalCall:
      after:
        seconds: 20
# Lemline currently enforces listen timeouts only. These limits express the DSL contract.
timeout:
  after:
    minutes: 3
do:
  - reserveInventory:
      try:
        - reserve:
            call: http
            timeout: externalCall
            with:
              method: post
              endpoint:
                uri: https://inventory.example.com/reservations
              headers:
                Idempotency-Key: ${ $workflow.input.order.id }
              body:
                orderId: ${ $workflow.input.order.id }
                items: ${ $workflow.input.order.items }
      catch:
        retry: transientHttp
        do:
          - failReservation:
              raise:
                error:
                  type: https://open-workflow-specification.org/spec/1.0.0/errors/runtime
                  status: 500
                  title: Inventory reservation failed
  - chargePayment:
      try:
        - charge:
            call: http
            timeout: externalCall
            with:
              method: post
              endpoint:
                uri: https://payments.example.com/charges
              headers:
                Idempotency-Key: ${ $workflow.input.order.id }
              body:
                orderId: ${ $workflow.input.order.id }
                amount: ${ $workflow.input.order.totalAmount }
      catch:
        retry: transientHttp
        do:
          - failPayment:
              raise:
                error:
                  type: https://open-workflow-specification.org/spec/1.0.0/errors/runtime
                  status: 500
                  title: Payment failed after retries
  - emitConfirmed:
      emit:
        event:
          with:
            source: https://workflows.example.com/orders
            type: com.example.order.confirmed.v1
            data: '${ {orderId: $workflow.input.order.id, totalAmount: $workflow.input.order.totalAmount} }'
