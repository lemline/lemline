document:
  dsl: "1.0.0"
  namespace: sample
  name: retry-timeout-http
  version: "1.0.0"
  title: Retry And Timeout Template
use:
  retries:
    transientHttp:
      limit:
        attempt:
          count: 5
      backoff:
        exponential: {}
      jitter:
        from:
          seconds: 1
        to:
          seconds: 3
  timeouts:
    shortCall:
      after:
        seconds: 20
timeout:
  after:
    minutes: 2
do:
  - invokeRemote:
      try:
        - callRemote:
            call: http
            timeout: shortCall
            with:
              method: get
              endpoint:
                uri: https://api.example.com/health
      catch:
        errors:
          with:
            type: https://serverlessworkflow.io/spec/1.0.0/errors/communication
            status: 503
        retry: transientHttp
        do:
          - raiseFinalFailure:
              raise:
                error:
                  type: https://serverlessworkflow.io/spec/1.0.0/errors/runtime
                  status: 500
                  title: Remote service remained unavailable
  - waitBeforeExit:
      wait:
        seconds: 1
      then: end

