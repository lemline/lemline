quarkus.application.name=lemline-gateway
quarkus.banner.enabled=false
quarkus.devservices.enabled=false
quarkus.package.main-class=gateway

# gRPC server
quarkus.grpc.server.use-separate-server=true
quarkus.grpc.server.plain-text=false
quarkus.grpc.server.host=0.0.0.0
quarkus.grpc.server.port=9000
quarkus.grpc.server.ssl.client-auth=required

# Disable HTTP server surfaces for the gateway process
quarkus.http.port=0
quarkus.http.ssl-port=0
quarkus.micrometer.enabled=true
quarkus.smallrye-health.enabled=false

# Native image defaults
%native.quarkus.native.enabled=true
%native.quarkus.package.jar.enabled=false
quarkus.native.additional-build-args=\
--verbose,\
--report-unsupported-elements-at-runtime,\
--initialize-at-run-time=com.github.f4b6a3.uuid

# Keep flyway disabled by default; enabled from lemline config source when needed
quarkus.flyway.migrate-at-start=false

# Ensure runner producer/infrastructure beans are indexed when consumed as a dependency.
quarkus.index-dependency.lemline-runner.group-id=com.lemline
quarkus.index-dependency.lemline-runner.artifact-id=lemline-runner

# Main datasource defaults used by runner infrastructure beans.
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:lemline;DB_CLOSE_DELAY=-1
quarkus.datasource.username=sa
quarkus.datasource.password=sa
quarkus.flyway.locations=classpath:db/migration/h2/

quarkus.datasource.postgresql.db-kind=postgresql
quarkus.datasource.postgresql.active=true
quarkus.flyway.postgresql.locations=classpath:db/migration/postgresql/

quarkus.datasource.mysql.db-kind=mysql
quarkus.datasource.mysql.active=true
quarkus.flyway.mysql.locations=classpath:db/migration/mysql/
