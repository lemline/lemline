name: Build the Lemline v7.1.0 Windows package

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/v7.1.0
          persist-credentials: false
      - name: Verify release source
        shell: pwsh
        run: |
          $commit = git rev-parse HEAD
          if ($commit -cne '4b1716a4f70cd82dc62f7a736fb04cb26532b585') {
            throw "Unexpected release commit $commit"
          }
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: graalvm/setup-graalvm@v1
        with:
          distribution: graalvm-community
          java-version: '25'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: gradle/actions/setup-gradle@v5
      - name: Build and test the Windows executable
        shell: pwsh
        run: |
          $env:GITHUB_REF = 'refs/tags/v7.1.0'
          $env:GITHUB_REF_NAME = 'v7.1.0'
          $gradleArgs = @(
            '--no-daemon'
            '--max-workers=2'
            '-Dorg.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8'
            ':lemline-runner:testNative'
            '-Dquarkus.native.native-image-xmx=8g'
            '--tests'
            '*PackagedCliIT.prints*'
            '--tests'
            '*SingleHostSQLiteIT'
          )
          & .\gradlew.bat @gradleArgs 2>&1 | Tee-Object -FilePath windows-tests.log
          exit $LASTEXITCODE
      - name: Package the tested Windows executable
        shell: pwsh
        run: |
          $binary = Get-Item 'lemline-runner/build/lemline-runner-7.1.0-runner.exe'
          $version = & $binary.FullName --version
          if ($LASTEXITCODE -ne 0 -or $version -cne 'Lemline Runner 7.1.0') {
            throw "Unexpected executable version $version"
          }
          New-Item -ItemType Directory -Force -Path 'dist/bin'
          Copy-Item $binary.FullName 'dist/bin/lemline.exe'
          Copy-Item LICENSE.md, README.md 'dist/'
          $archive = 'lemline-v7.1.0-windows-x86_64.zip'
          Compress-Archive -Path 'dist/*' -DestinationPath $archive
          (Get-FileHash $archive -Algorithm SHA256).Hash | Out-File -Encoding ASCII "$archive.sha256"
      - name: Attach the Windows package and checksum
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v7.1.0 lemline-v7.1.0-windows-x86_64.zip lemline-v7.1.0-windows-x86_64.zip.sha256 --repo lemline/lemline
          exit $LASTEXITCODE
      - name: Save Windows test evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-v7.1.0-test-evidence
          path: |
            windows-tests.log
            **/build/test-results/**/TEST-*.xml
            **/build/packaged-process-logs/**
          if-no-files-found: ignore
