name: Native Binary Tests

# Builds the native binary on each release platform and runs the packaged-artifact tests
# (lemline-runner/src/integrationTest) against it. Started by hand only: Actions → "Native Binary Tests"
# → "Run workflow", on the branch to check.
on:
  workflow_dispatch: { }

permissions:
  contents: read

jobs:
  native-tests:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux runs every test: Docker provides the PostgreSQL container
          - runner: ubuntu-22.04
            platform: linux-x86_64
            tests: ''
            gradle_xmx: 2g
            # The runner has 16 GB; 5g ran out of heap intermittently
            native_xmx: 8g
          # No Linux containers on these runners: run the tests that need no database
          - runner: windows-2022
            platform: windows-x86_64
            tests: --tests "*PackagedCliIT.prints*"
            gradle_xmx: 2g
            native_xmx: 5g
          # No macOS entry: GitHub's free macOS runners (7 GB) cannot hold the native build
          # (about 6.5 GB). On a Mac, run: ./gradlew :lemline-runner:testNative

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up GraalVM Native Image
        uses: graalvm/setup-graalvm@v1
        with:
          distribution: graalvm-community
          java-version: 25
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup MSBuild
        if: ${{ runner.os == 'Windows' }}
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Setup MSVC (Windows)
        if: ${{ runner.os == 'Windows' }}
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Java 17 for Gradle toolchain
        if: ${{ runner.os == 'Windows' }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Build native binary and run its tests (Linux, macOS)
        if: ${{ runner.os != 'Windows' }}
        run: |
          ./gradlew --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx${{ matrix.gradle_xmx }} -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" \
            :lemline-runner:testNative ${{ matrix.tests }} \
            -Dquarkus.native.native-image-xmx=${{ matrix.native_xmx }}

      - name: Build native binary and run its tests (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: cmd
        run: |
          gradlew.bat --no-daemon ^
            -Dorg.gradle.jvmargs="-Xmx${{ matrix.gradle_xmx }} -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" ^
            :lemline-runner:testNative ${{ matrix.tests }} ^
            -Dquarkus.native.native-image-xmx=${{ matrix.native_xmx }}

      - name: Upload test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: native-test-reports-${{ matrix.platform }}
          path: lemline-runner/build/reports/tests/
          if-no-files-found: ignore
