name: Build and Deploy Writerside Documentation

on:
  pull_request:
    paths:
      - 'lemline-docs/**'
      - '.github/workflows/build-docs.yml'
  push:
    branches: [ "main" ]
    paths:
      - 'lemline-docs/**'
      - '.github/workflows/build-docs.yml'
      - '.github/workflows/docs-workflows.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  INSTANCE: 'lemline-docs/lemline'  # Adjust 'hi' if your instance ID differs
  DOCKER_VERSION: '2025.04.8412'  # Use the latest Writerside Docker version

jobs:
  validate_workflows:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/docs-workflows.yml

  build:
    needs: validate_workflows
    if: ${{ !cancelled() && (needs.validate_workflows.result == 'success' || github.event_name == 'pull_request') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Define Artifact Name
        id: define-ids
        run: |
          INSTANCE_ID=${INSTANCE#*/}
          INSTANCE_ID_UPPER=$(echo "$INSTANCE_ID" | tr '[:lower:]' '[:upper:]')
          ARTIFACT="webHelp${INSTANCE_ID_UPPER}2-all.zip"
          echo "artifact=$ARTIFACT" >> $GITHUB_OUTPUT
          echo "INSTANCE_ID_UPPER=$INSTANCE_ID_UPPER" >> $GITHUB_ENV

      - name: Build Documentation
        uses: JetBrains/writerside-github-action@v4
        with:
          instance: ${{ env.INSTANCE }}
          docker-version: ${{ env.DOCKER_VERSION }}

      - name: Prepare and verify social previews
        env:
          DOCS_ARCHIVE: artifacts/${{ steps.define-ids.outputs.artifact }}
        run: |
          unzip -O UTF-8 -qq "$DOCS_ARCHIVE" -d dir
          cp lemline-docs/images/social-preview.png dir/
          python3 lemline-docs/validation/prepare_social_preview.py dir
          (cd dir && zip -q "../$DOCS_ARCHIVE" index.html social-preview.png)

      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: docs
          path: |
            artifacts/${{ steps.define-ids.outputs.artifact }}
            artifacts/report.json
          retention-days: 7

      - name: Check Writerside build report
        uses: JetBrains/writerside-checker-action@v1
        with:
          instance: ${{ env.INSTANCE }}

      - name: Upload Pages Artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dir
          retention-days: 7
          # v3 published dotfiles; later versions leave them out unless asked.
          include-hidden-files: true

  deploy:
    # Wait for the build job so Pages can look up the uploaded artifact.
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
