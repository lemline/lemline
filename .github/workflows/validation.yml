name: Validation

# These suites and native builds are long. They validate what lands on main instead of every
# commit of a pull request; run the workflow manually on a branch to check it before merging.
on:
  push:
    branches: [main]
    paths:
      - 'lemline-*/**'
      - 'buildSrc/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm:
    name: JVM / ${{ matrix.suite }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: persistence
            task: test spotlessCheck -x :lemline-runner:test
          - suite: runner
            task: :lemline-runner:test
          - suite: fast-jar
            task: :lemline-runner:quarkusIntTest
          - suite: uber-jar
            task: :lemline-runner:quarkusIntTest -Dquarkus.package.jar.type=uber-jar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            25
      - uses: gradle/actions/setup-gradle@v4
      - name: Run tests and record the tested revision
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee tested-revision.txt
          docker info --format '{{.ServerVersion}}'
          gradle_args=(--max-workers=2 '-Dorg.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8')
          ./gradlew "${gradle_args[@]}" ${{ matrix.task }} 2>&1 | tee validation.log
          if [[ '${{ matrix.suite }}' == fast-jar ]]; then
            RUN_JAR_TESTS=true ./gradlew "${gradle_args[@]}" :lemline-runner:test --tests '*ConnectorConfigJarTest' 2>&1 | tee connector-jar.log
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jvm-${{ matrix.suite }}
          if-no-files-found: warn
          path: |
            tested-revision.txt
            validation.log
            connector-jar.log
            **/build/test-results/**/TEST-*.xml
            **/build/packaged-process-logs/**

  native:
    name: Native / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
          - os: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: graalvm/setup-graalvm@v1
        with:
          distribution: graalvm-community
          java-version: '25'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test the Linux executable
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee tested-revision.txt
          ./gradlew --max-workers=2 \
            '-Dorg.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8' \
            :lemline-runner:testNative -Dquarkus.native.native-image-xmx=5g \
            2>&1 | tee validation.log
      - name: Build and test the Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git rev-parse HEAD | Tee-Object -FilePath tested-revision.txt
          & .\gradlew.bat --max-workers=2 `
            '-Dorg.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8' `
            :lemline-runner:testNative '-Dquarkus.native.native-image-xmx=5g' `
            --tests '*PackagedCliIT.prints*' --tests '*SingleHostSQLiteIT' `
            2>&1 | Tee-Object -FilePath validation.log
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-${{ matrix.os }}
          path: |
            tested-revision.txt
            validation.log
            **/build/test-results/**/TEST-*.xml
            **/build/packaged-process-logs/**
