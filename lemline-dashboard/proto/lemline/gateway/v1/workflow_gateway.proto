syntax = "proto3";

package lemline.gateway.v1;

option java_multiple_files = true;
option java_package = "com.lemline.gateway.v1";
option java_outer_classname = "WorkflowGatewayProto";

service WorkflowGateway {
  rpc StartWorkflow(StartWorkflowRequest) returns (StartWorkflowResponse);
  rpc WatchWorkflow(WatchWorkflowRequest) returns (stream WorkflowAnalyticsEvent);
  rpc ListNamespaces(ListNamespacesRequest) returns (ListNamespacesResponse);
  rpc ListDefinitions(ListDefinitionsRequest) returns (ListDefinitionsResponse);
  rpc GetDefinition(GetDefinitionRequest) returns (GetDefinitionResponse);
  rpc GetDefinitionStats(GetDefinitionStatsRequest) returns (GetDefinitionStatsResponse);
  rpc ListInstances(ListInstancesRequest) returns (ListInstancesResponse);
  rpc GetInstanceTimeline(GetInstanceTimelineRequest) returns (GetInstanceTimelineResponse);
  rpc WatchDefinitionStats(WatchDefinitionStatsRequest) returns (stream DefinitionStatsUpdate);
  rpc WatchInstances(WatchInstancesRequest) returns (stream InstanceUpdate);
}

message StartWorkflowRequest {
  string workflow_id = 1;
  string namespace = 2;
  string name = 3;
  string version = 4;
  optional string input_json = 5;
  optional string zone_id = 6;
}

message StartWorkflowResponse {
  enum Result {
    START_WORKFLOW_RESULT_UNSPECIFIED = 0;
    START_WORKFLOW_RESULT_ACCEPTED_NEW = 1;
    START_WORKFLOW_RESULT_ACCEPTED_EXISTING = 2;
  }

  string workflow_id = 1;
  Result result = 2;
}

message WatchWorkflowRequest {
  string workflow_id = 1;
}

message WorkflowAnalyticsEvent {
  int64 cursor = 1;
  string cloudevent_json = 2;
}

message ListNamespacesRequest {}

message ListNamespacesResponse {
  repeated string namespaces = 1;
}

message ListDefinitionsRequest {
  string namespace = 1;
  optional string name = 2;
  optional bool latest_only = 3;
}

message ListDefinitionsResponse {
  repeated WorkflowDefinitionSummary definitions = 1;
}

message WorkflowDefinitionSummary {
  string namespace = 1;
  string name = 2;
  string version = 3;
  bool is_latest = 4;
  int32 version_count = 5;
  string created_at = 6;
  string updated_at = 7;
}

message GetDefinitionRequest {
  string namespace = 1;
  string name = 2;
  optional string version = 3;
}

message GetDefinitionResponse {
  string namespace = 1;
  string name = 2;
  string version = 3;
  string definition = 4;
  repeated string available_versions = 5;
}

message GetDefinitionStatsRequest {
  optional string namespace = 1;
  optional string name = 2;
  optional string time_from = 3;
  optional string time_to = 4;
  optional string version = 5;
}

message GetDefinitionStatsResponse {
  repeated DefinitionStats stats = 1;
}

message DefinitionStats {
  string namespace = 1;
  string name = 2;
  optional string version = 3;
  int64 started = 4;
  int64 completed = 5;
  int64 faulted = 6;
  int64 running = 7;
}

message WatchDefinitionStatsRequest {
  optional string namespace = 1;
  optional string name = 2;
  optional string version = 3;
  optional string time_from = 4;
  optional string time_to = 5;
}

message DefinitionStatsUpdate {
  DefinitionStats stats = 1;
}

message ListInstancesRequest {
  optional string namespace = 1;
  optional string name = 2;
  optional string status = 3;
  optional string time_from = 4;
  optional string time_to = 5;
  optional string workflow_id = 6;
  int32 page_size = 7;
  optional string page_cursor = 8;
  optional string version = 9;
  optional string workflow_id_prefix = 10;
}

message ListInstancesResponse {
  repeated WorkflowInstance instances = 1;
  optional string next_cursor = 2;
  int64 total_count = 3;
}

message WorkflowInstance {
  string workflow_id = 1;
  string namespace = 2;
  string name = 3;
  string version = 4;
  string status = 5;
  string created_at = 6;
  optional string started_at = 7;
  optional string completed_at = 8;
  optional string faulted_at = 9;
  optional int64 duration_ms = 10;
  optional ErrorSummary error = 11;
}

message ErrorSummary {
  string type = 1;
  int32 status = 2;
  string title = 3;
}

message WatchInstancesRequest {
  optional string namespace = 1;
  optional string name = 2;
  optional string version = 3;
  optional int64 after_sequence = 4;
}

message InstanceUpdate {
  WorkflowInstance instance = 1;
  string update_type = 2;
  int64 sequence = 3;
}

message GetInstanceTimelineRequest {
  string workflow_id = 1;
  bool include_definition = 2;
}

message GetInstanceTimelineResponse {
  string workflow_id = 1;
  string namespace = 2;
  string name = 3;
  string version = 4;
  string status = 5;
  repeated TimelineEvent events = 6;
  optional string definition = 7;
}

message TimelineEvent {
  int64 sequence = 1;
  string event_type = 2;
  string event_time = 3;
  string category = 4;
  optional string task_pointer = 5;
  optional string task_name = 6;
  string payload_json = 7;
}
