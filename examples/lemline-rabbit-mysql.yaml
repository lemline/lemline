# Lemline Configuration: RabbitMQ + MySQL
#
# Start infrastructure:
#   docker compose --profile rabbit-mysql up -d
#
# Run Lemline:
#   LEMLINE_CONFIG=./examples/lemline-rabbit-mysql.yaml java -jar lemline-runner.jar listen

lemline:
  database:
    type: mysql
    mysql:
      host: localhost
      port: 3306
      name: lemline
      username: lemline
      password: lemline

  messaging:
    type: rabbitmq
    rabbitmq:
      hostname: localhost
      port: 5672
      username: guest
      password: guest
      commands:
        queue: lemline-commands
        consumer:
          concurrency: 4
      events:
        queue: lemline-events
        consumer:
          concurrency: 2
