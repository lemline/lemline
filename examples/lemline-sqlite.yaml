# Run the gateway and worker from the same local data directory.
lemline:
  namespaces: [default]
  database:
    type: sqlite
    migrate-at-start: true
    sqlite:
      path: orchestration.db
  analytics:
    type: sqlite
    migrate-at-start: true
    sqlite:
      path: analytics.db
  messaging:
    type: sqlite
    sqlite:
      path: messaging.db
  gateway:
    grpc:
      host: 127.0.0.1
    tls:
      enabled: false
    authentication:
      enabled: false
