document:
  dsl: '1.0.0'
  # "default" is the namespace a zero-config runner follows — a workflow in another
  # namespace stays pending until a runner is configured to follow it (lemline.namespaces)
  namespace: default
  name: hello-workflow
  version: '0.1.0'
do:
  - setGreeting:
      set:
        message: Hello, Lemline!
  - logMessage:
      call: https://raw.githubusercontent.com/serverlessworkflow/catalog/main/functions/log/1.0.0/function.yaml
      with:
        message: ${ .message }

