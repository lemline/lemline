document:
  dsl: '1.0.3'
  namespace: test
  name: a2a-example
  version: '0.1.0'
do:
  - GenerateReport:
      call: a2a
      with:
        method: message/send
        agentCard:
          endpoint: https://example.com/.well-known/agent-card.json
        parameters:
          message:
            parts:
              - kind: text
                text: Generate the Q1 sales report.
