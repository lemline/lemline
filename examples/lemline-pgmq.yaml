# Lemline Configuration: PGMQ + PostgreSQL
#
# This configuration uses PostgreSQL for both database storage AND messaging.
# Lemline implements PGMQ using pure SQL (no PostgreSQL extension required).
#
# Start infrastructure:
#   docker compose --profile pgmq up -d
#
# Run Lemline:
#   LEMLINE_CONFIG=./examples/lemline-pgmq.yaml java -jar lemline-runner.jar listen

lemline:
  database:
    type: postgresql
    postgresql:
      host: localhost
      port: 5432
      name: lemline
      username: postgres
      password: postgres

  messaging:
    type: pgmq
    pgmq:
      host: localhost
      port: 5432
      database: lemline
      username: postgres
      password: postgres

