# Lemline Configuration: RabbitMQ + PostgreSQL
#
# Start infrastructure:
#   docker compose --profile rabbit-pg up -d
#
# Run Lemline:
#   LEMLINE_CONFIG=./examples/lemline-rabbit-pg.yaml java -jar lemline-runner.jar listen

lemline:
  database:
    type: postgresql
    postgresql:
      host: localhost
      port: 5432
      name: lemline
      username: postgres
      password: postgres

  messaging:
    type: rabbitmq
    rabbitmq:
      hostname: localhost
      port: 5672
      username: guest
      password: guest
      commands:
        queue: lemline-commands
        consumer:
          concurrency: 4
      events:
        queue: lemline-events
        consumer:
          concurrency: 2
