# Lemline Configuration: RabbitMQ + PostgreSQL
#
# Start infrastructure:
#   docker compose --profile rabbit-pg up -d
#
# Run Lemline:
#   LEMLINE_CONFIG=./examples/lemline-rabbit-pg.yaml java -jar lemline-runner.jar listen

lemline:
  database:
    postgresql:
      host: localhost
      port: 5432
      database: lemline
      username: postgres
      password: postgres

  messaging:
    rabbitmq:
      hostname: localhost
      port: 5672
      username: guest
      password: guest

