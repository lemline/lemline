syntax = "proto3";

package lemline.internal.v1;

import "internal/state/node_state.proto";

option java_multiple_files = true;
option java_package = "com.lemline.messages.internal.v1";

message NodeStackProto {
    repeated StackFrameProto frames = 1;
}

message StackFrameProto {
    string position = 1;
    NodeStateProto state = 2;
    int32 counter = 3;
}
