syntax = "proto3";

package lemline.internal.v1;

import "internal/state/node_state.proto";
import "internal/state/extensions.proto";

option java_multiple_files = true;
option java_package = "com.lemline.messages.internal.v1";

message NodeStackProto {
    repeated StackFrameProto frames = 1;
}

message StackFrameProto {
    string position = 1;
    NodeStateProto state = 2;
    int32 counter = 3;
    ExtensionExecutionStateProto extension = 4;
    // Set only when the task reads its inputs once it completes.
    TaskInputProto input = 5;
}

message TaskInputProto {
    ExtensionJsonValueProto raw_json = 1;
    ExtensionJsonValueProto transformed_json = 2;
}
