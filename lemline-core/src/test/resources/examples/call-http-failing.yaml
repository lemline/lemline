document:
  dsl: '1.0.0'
  namespace: examples
  name: call-http-failing
  version: '0.1.0'
use:
  retries:
    default:
      delay:
        seconds: 3
      backoff:
        exponential: { }
      limit:
        attempt:
          count: 5
do:
  - tryGetPet:
      try:
        - getPet:
            call: http
            with:
              method: get
              endpoint: https://petstore.swagger.io/v2/pet/0
      catch:
        errors:
          with:
            type: https://serverlessworkflow.io/spec/1.0.0/errors/communication
            status: 404
        retry: default

