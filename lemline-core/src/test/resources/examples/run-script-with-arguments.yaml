document:
  dsl: '1.0.3'
  namespace: samples
  name: run-script-with-arguments
  version: 0.1.0
do:
  - log:
      run:
        script:
          language: js
          arguments:
            message: ${ .message }
          code: >
            console.log(process.argv[process.argv.indexOf('message') + 1])