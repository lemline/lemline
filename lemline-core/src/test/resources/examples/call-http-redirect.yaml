# yaml-language-server: $schema=https://raw.githubusercontent.com/open-workflow-specification/sdk-java/7.35.3.Final/types/src/main/resources/schema/workflow.yaml
document:
  dsl: '1.0.3'
  namespace: examples
  name: http-query-params
  version: '1.0.0'
input:
  schema:
    format: json
    document:
      type: object
      required:
        - searchQuery
      properties:
        searchQuery:
          type: string
do:
  - searchStarWarsCharacters:
      call: http
      with:
        method: get
        endpoint: https://swapi.dev/api/people/
        query:
          search: ${.searchQuery}
        redirect: true
      
