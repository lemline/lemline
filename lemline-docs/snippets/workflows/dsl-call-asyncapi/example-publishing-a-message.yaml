document:
  dsl: 1.0.0
  namespace: test
  name: asyncapi-publish-example
  version: 0.1.0
do:
  - publishGreeting:
      call: asyncapi
      with:
        document:
          endpoint: https://broker.example.com/docs/asyncapi.json
        operation: sendGreeting
        server:
          name: productionBroker
          variables:
            environment: prod
        message:
          payload:
            greeting: Hello from workflow ${ $workflow.id }
          headers:
            traceId: ${ $context.traceId }
  - afterPublish:
      set:
        processed: true
