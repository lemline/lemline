document:
  dsl: '1.0.3'
  namespace: examples
  name: asyncapi-publish-payment
  version: '1.0.0'
do:
  - publish:
      call: asyncapi
      with:
        document:
          endpoint: http://127.0.0.1:8787/asyncapi.json
        operation: publishPayment
        server:
          name: tutorial
        protocol: http
        message:
          payload:
            orderId: ${ .orderId }
