document:
  dsl: '1.0.3'
  namespace: examples
  name: asyncapi-receive-payment
  version: '1.0.0'
do:
  - receive:
      call: asyncapi
      with:
        document:
          endpoint: http://127.0.0.1:8787/asyncapi.json
        operation: receivePayment
        server:
          name: tutorial
        protocol: http
        subscription:
          filter: ${ .orderId == $workflow.input.orderId }
          consume:
            amount: 1
            for: PT30S
