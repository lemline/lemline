document:
  dsl: '1.0.3'
  namespace: examples
  name: graduated-timeouts
  version: '1.0.0'
do:
  - tryCache:
      try:
        - lookupCache:
            call: http
            with:
              method: get
              endpoint: '${ "http://127.0.0.1:8787/products/\(.itemId)" + (if .cacheMiss then "?fail=404" else "" end) }'
            timeout:
              after:
                milliseconds: 500
            output:
              as: '${ . + { source: "cache" } }'
      catch:
        when: ${ $error.title | startswith("HTTP 404") }
        do:
          - lookupDatabase:
              try:
                - queryDatabase:
                    call: http
                    with:
                      method: get
                      endpoint: '${ "http://127.0.0.1:8787/products/\($workflow.input.itemId)?delayMs=\($workflow.input.databaseDelayMs // 0)" }'
                    timeout:
                      after:
                        seconds: 3
                    output:
                      as: '${ . + { source: "database" } }'
              catch:
                do:
                  - computeFallback:
                      set:
                        id: ${ $workflow.input.itemId }
                        source: fallback
