document:
  dsl: '1.0.3'
  namespace: examples
  name: database-timeouts
  version: '1.0.0'
do:
  - simpleQuery:
      try:
        - executeQuery:
            call: http
            with:
              method: get
              endpoint: http://127.0.0.1:8787/products
              query:
                size: '10'
            timeout:
              after:
                seconds: 3
            export:
              as: '${ $context + { queryResult: .total } }'
      catch:
        errors:
          with:
            type: https://open-workflow-specification.org/spec/1.0.0/errors/timeout
        retry:
          delay:
            milliseconds: 500
          limit:
            attempt:
              count: 2
  - complexQuery:
      try:
        - executeComplexQuery:
            call: http
            with:
              method: get
              endpoint: http://127.0.0.1:8787/products
              query:
                category: garden
                search: hose
                delayMs: ${ $workflow.input.slowQueryMs // 0 | tostring }
            timeout:
              after:
                seconds: 1
            export:
              as: '${ $context + { complexResult: [.items[].id] } }'
      catch:
        errors:
          with:
            type: https://open-workflow-specification.org/spec/1.0.0/errors/timeout
        do:
          - simplifyAndRetry:
              call: http
              with:
                method: get
                endpoint: http://127.0.0.1:8787/products
                query:
                  category: garden
              export:
                as: '${ $context + { usedSimplifiedQuery: true, simplifiedResult: [.items[].id] } }'
  - summarize:
      set:
        results: ${ $context }
