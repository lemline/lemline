document:
  dsl: '1.0.3'
  namespace: examples
  name: api-timeouts
  version: '1.0.0'
do:
  - callReliableApi:
      call: http
      with:
        method: get
        endpoint: http://127.0.0.1:8787/stock
      timeout:
        after:
          seconds: 2
      export:
        as: '${ $context + { stock: .available } }'
  - callThirdPartyApi:
      try:
        - getProduct:
            call: http
            with:
              method: get
              endpoint: http://127.0.0.1:8787/products/SKU-4
              query:
                delayMs: ${ $workflow.input.thirdPartyDelayMs // 0 | tostring }
            timeout:
              after:
                seconds: 5
            export:
              as: '${ $context + { product: .name, source: "live" } }'
      catch:
        do:
          - useCachedProduct:
              set:
                cached: true
              export:
                as: '${ $context + { product: "Desk lamp", source: "cache" } }'
  - summarize:
      set:
        results: ${ $context }
