document:
  dsl: '1.0.0'
  namespace: examples
  name: http-error-fallback
  version: '1.0.0'
do:
  - callExternalService:
      try:
        - fetchData:
            call: http
            with:
              method: get
              endpoint: https://api.example/data
      catch:
        as: requestError
        do:
          - returnFailure:
              set:
                success: false
                reason: External HTTP request failed
                errorType: ${ $requestError.type }
                status: ${ $requestError.status }
