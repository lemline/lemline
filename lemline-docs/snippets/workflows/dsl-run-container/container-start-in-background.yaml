document:
  dsl: '1.0.3'
  namespace: examples
  name: container-start-in-background
  version: '1.0.0'
do:
  - startJob:
      run:
        container:
          image: node:22-alpine
          command: node -p "42"
          environment:
            ORDER_ID: ${ .orderId }
        await: false
  - acknowledge:
      set:
        orderId: ${ .orderId }
        submitted: true
