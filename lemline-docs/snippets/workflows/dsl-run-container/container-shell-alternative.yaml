document:
  dsl: '1.0.3'
  namespace: examples
  name: container-shell-alternative
  version: '1.0.0'
do:
  - printOrder:
      run:
        shell:
          command: sh
          arguments:
            - '-c'
            - 'printf "%s" "$ORDER_ID"'
          environment:
            ORDER_ID: ${ .orderId }
        return: stdout
