document:
  dsl: '1.0.0'
  namespace: examples
  name: example-getting-all-process-results
  version: '1.0.0'
do:
  - runDiagnostics:
      run:
        container:
          image: diagnostics-tool:v2
          command: "--check-all --verbose"
        # Get code, stdout, and stderr
        return: all
      then: analyzeDiagnostics
  - analyzeDiagnostics:
      # Input: { "code": 0, "stdout": "...", "stderr": "..." }
      set:
        exitCode: "${ .code }"
        outputLog: "${ .stdout }"
        errorLog: "${ .stderr }"
