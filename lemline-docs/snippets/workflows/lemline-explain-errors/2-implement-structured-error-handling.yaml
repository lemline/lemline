document:
  dsl: '1.0.3'
  namespace: examples
  name: 2-implement-structured-error-handling
  version: '1.0.0'
do:
  - mainFlow:
      try:
        - validateInput:
            set:
              orderId: ${ .orderId }
              token: ${ .token }
        - processOrder:
            try:
              - reserveInventory:
                  set:
                    reserved: true
              - processPayment:
                  if: ${ $workflow.input.token == "declined" }
                  raise:
                    error:
                      type: https://example.com/errors/payment-declined
                      status: 400
                      title: Payment declined
            catch:
              errors:
                with:
                  type: https://example.com/errors/payment-declined
              do:
                - handleError:
                    set:
                      paymentDeclined: true
        - fulfillOrder:
            set:
              fulfilled: ${ (.paymentDeclined // false) | not }
      catch: {}
