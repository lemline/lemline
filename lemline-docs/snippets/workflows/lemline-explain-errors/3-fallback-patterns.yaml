document:
  dsl: '1.0.3'
  namespace: examples
  name: 3-fallback-patterns
  version: '1.0.0'
do:
  - getCustomerProfile:
      try:
        - fetchFromApi:
            call: http
            with:
              endpoint: '${ "http://127.0.0.1:8787/customers/\(.customerId)" + (if .apiDown then "?fail=503" else "" end) }'
              method: get
      catch:
        do:
          - useCachedData:
              call: http
              with:
                endpoint: ${ "http://127.0.0.1:8787/customers/\($workflow.input.customerId)" }
                method: get
          - markStale:
              set:
                name: ${ .name }
                dataSource: cache
                isFresh: false
