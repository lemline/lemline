document:
  dsl: 1.0.3
  namespace: examples
  name: 1-try-catch-blocks
  version: 1.0.0
do:
  - processPayment:
      try:
        - chargeCard:
            call: http
            with:
              method: post
              endpoint: https://payment.example.com/charge
      catch:
        errors:
          with:
            type: https://open-workflow-specification.org/spec/1.0.0/errors/communication
            status: 503
        as: paymentError
        do:
          - logError:
              set:
                errorMessage: '${ "Payment service unavailable: \($paymentError.details)" }'
