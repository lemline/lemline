document:
  dsl: '1.0.3'
  namespace: examples
  name: 1-try-catch-blocks
  version: '1.0.0'
do:
  - processPayment:
      try:
        - chargeCard:
            call: http
            with:
              method: post
              endpoint: http://127.0.0.1:8787/charges?fail=503
              body:
                orderId: ${ .orderId }
      catch:
        when: ${ $paymentError.title | startswith("HTTP 503") }
        as: paymentError
        do:
          - logError:
              set:
                errorMessage: '${ "Payment service unavailable: \($paymentError.title)" }'
