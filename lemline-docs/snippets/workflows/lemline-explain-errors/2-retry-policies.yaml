document:
  dsl: '1.0.3'
  namespace: examples
  name: 2-retry-policies
  version: '1.0.0'
do:
  - readStock:
      try:
        - requestStock:
            call: http
            with:
              method: get
              endpoint: '${ "http://127.0.0.1:8787/stock?fail=503&failTimes=2&key=\($workflow.id)" }'
      catch:
        retry:
          delay:
            seconds: 1
          backoff:
            exponential: {}
          limit:
            attempt:
              count: 3
