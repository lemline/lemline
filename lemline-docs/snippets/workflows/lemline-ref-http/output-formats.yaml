document:
  dsl: '1.0.3'
  namespace: examples
  name: output-formats
  version: '1.0.0'
do:
  - fetchProducts:
      call: http
      with:
        method: get
        endpoint: http://127.0.0.1:8787/products
        output: response
      output:
        as: '${ { status: .statusCode, ids: [.content.items[].id] } }'
