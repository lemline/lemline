document:
  dsl: '1.0.3'
  namespace: examples
  name: named-authentication
  version: '1.0.0'
use:
  secrets:
    - API_TOKEN
  authentications:
    apiAuth:
      bearer:
        token: ${ $secrets.API_TOKEN }
do:
  - callApi:
      call: http
      with:
        method: get
        endpoint:
          uri: http://127.0.0.1:8787/partner/stock
          authentication:
            use: apiAuth
