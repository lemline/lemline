document:
  dsl: '1.0.3'
  namespace: examples
  name: error-status-handling
  version: '1.0.0'
do:
  - fetchData:
      try:
        - callApi:
            call: http
            with:
              method: get
              endpoint: https://api.example.com/data
      catch:
        errors:
          with:
            type: https://open-workflow-specification.org/spec/1.0.0/errors/communication
        as: apiError
        do:
          - fallback:
              set:
                data: []
