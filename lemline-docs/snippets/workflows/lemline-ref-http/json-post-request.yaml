document:
  dsl: '1.0.3'
  namespace: examples
  name: json-post-request
  version: '1.0.0'
do:
  - createReservation:
      call: http
      with:
        method: post
        endpoint: http://127.0.0.1:8787/reservations
        headers:
          Idempotency-Key: ${ .orderId }
        body:
          orderId: ${ .orderId }
          items: ${ .items }
        output: response
