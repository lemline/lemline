document:
  dsl: '1.0.3'
  namespace: examples
  name: customer-graphql-lookup
  version: '1.0.0'
do:
  - queryGraphQL:
      call: http
      with:
        method: post
        endpoint: http://127.0.0.1:8787/graphql
        body:
          query: "query($id: ID!) { customer(id: $id) { name email } }"
          variables:
            id: ${ .customerId }
