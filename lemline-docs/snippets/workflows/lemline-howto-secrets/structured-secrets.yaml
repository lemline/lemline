document:
  dsl: '1.0.0'
  namespace: examples
  name: structured-secrets
  version: '1.0.0'
use:
  secrets:
    - DB_CREDENTIALS
do:
  - connect:
      call: http
      with:
        method: post
        endpoint: https://db-proxy.example.com/sessions
        body:
          user: ${ $secrets.DB_CREDENTIALS.username }
          password: ${ $secrets.DB_CREDENTIALS.password }
