document:
  dsl: '1.0.3'
  namespace: billing
  name: charge-customer
  version: '1.0.0'
use:
  secrets:
    - PAYMENT_API_KEY
do:
  - charge:
      call: http
      with:
        method: post
        endpoint: https://payments.example.com/v1/charges
        headers:
          Authorization: '${ "Bearer " + $secrets.PAYMENT_API_KEY }'
