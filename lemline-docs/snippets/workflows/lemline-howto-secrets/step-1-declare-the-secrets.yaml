document:
  dsl: '1.0.3'
  namespace: examples
  name: declare-secrets
  version: '1.0.0'
use:
  secrets:
    - PARTNER_TOKEN
do:
  - getPartnerStock:
      call: http
      with:
        method: get
        endpoint: http://127.0.0.1:8787/partner/stock
        headers:
          Authorization: '${ "Bearer " + $secrets.PARTNER_TOKEN }'
