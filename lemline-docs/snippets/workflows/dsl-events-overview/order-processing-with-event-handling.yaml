document:
  dsl: '1.0.3'
  namespace: examples
  name: event-driven-order-processing
  version: '1.0.0'
schedule:
  on:
    one:
      with:
        type: com.example.order.created
input:
  from: ${ .[0] }
do:
  - storeOrder:
      set:
        orderId: ${ .orderId }
      export:
        as: '${ $context + { orderId: .orderId } }'
  - getPayment:
      try:
        - waitForPayment:
            listen:
              to:
                one:
                  with:
                    type: com.example.payment.processed
                  correlate:
                    orderId:
                      from: ${ .orderId }
                      expect: ${ .context.orderId }
            timeout:
              after: PT1H
            output:
              as: ${ .[0] }
      catch:
        errors:
          with:
            type: https://open-workflow-specification.org/spec/1.0.0/errors/timeout
        do:
          - readStoredPaymentStatus:
              call: http
              with:
                method: get
                endpoint: '${ "https://payments.example/status/\($context.orderId | @uri)" }'
  - reportPayment:
      emit:
        event:
          with:
            source: https://orders.example
            type: com.example.order.payment-status
            data: '${ { orderId: $context.orderId, status: .status } }'
