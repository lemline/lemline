document:
  dsl: '1.0.3'
  namespace: examples
  name: coordinate-onboarding
  version: '1.0.0'
schedule:
  on:
    one:
      with:
        type: com.example.user.registered
input:
  from: ${ .[0] }
do:
  - onboard:
      fork:
        branches:
          - createCustomer:
              call: http
              with:
                method: post
                endpoint: http://127.0.0.1:8787/customers
                body:
                  name: ${ .name }
                  email: ${ .email }
          - sendWelcome:
              call: http
              with:
                method: post
                endpoint: http://127.0.0.1:8787/notifications
                body:
                  reference: ${ .registrationId }
                  recipient: ${ .email }
                  message: Welcome to the tutorial shop
  - summarize:
      set:
        customerId: '${ [.[] | .id // empty][0] }'
        registrationId: ${ $workflow.input[0].registrationId }
  - publishCompletion:
      emit:
        event:
          with:
            source: http://127.0.0.1:8787/onboarding
            type: com.example.onboarding.completed
            data: ${ . }
