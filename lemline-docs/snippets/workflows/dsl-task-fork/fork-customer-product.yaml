document:
  dsl: '1.0.3'
  namespace: examples
  name: fork-customer-product
  version: '1.0.0'
do:
  - getDetails:
      fork:
        branches:
          - customer:
              call: http
              with:
                method: get
                endpoint: '${ "http://127.0.0.1:8787/customers/" + .customerId }'
          - product:
              call: http
              with:
                method: get
                endpoint: '${ "http://127.0.0.1:8787/products/" + .productId }'
  - combineResults:
      set:
        customer: ${ .[0].name }
        productId: ${ .[1].id }
