document:
  dsl: 1.0.3
  namespace: examples
  name: example-competing-branches-compete-true
  version: 1.0.0
do:
  - fetchFastestQuote:
      fork:
        branches:
          - getQuoteSourceA:
              call: http
              with:
                method: get
                endpoint: https://api.sourceA.com/quote
          - getQuoteSourceB:
              call: http
              with:
                method: get
                endpoint: https://api.sourceB.com/quote
        compete: true
      then: processBestQuote
  - processBestQuote:
      set:
        processed: true
