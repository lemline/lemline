document:
  dsl: '1.0.3'
  namespace: examples
  name: fork-quote-race
  version: '1.0.0'
do:
  - fetchFastestQuote:
      fork:
        compete: true
        branches:
          - economyQuote:
              call: http
              with:
                method: post
                endpoint: http://127.0.0.1:8787/quotes/economy
                query:
                  delayMs: '8000'
                body:
                  orderId: ${ .orderId }
          - expressQuote:
              call: http
              with:
                method: post
                endpoint: http://127.0.0.1:8787/quotes/express
                body:
                  orderId: ${ .orderId }
  - processWinningQuote:
      set:
        carrier: ${ .carrier }
        price: ${ .price }
