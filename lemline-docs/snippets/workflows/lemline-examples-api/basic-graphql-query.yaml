document:
  dsl: 1.0.0
  namespace: examples
  name: graphql-query
  version: 1.0.0
input:
  schema:
    format: json
    document:
      type: object
      required:
        - userId
      properties:
        userId:
          type: string
use:
  secrets:
    - API_TOKEN
do:
  - fetchUserData:
      call: http
      with:
        method: post
        endpoint: https://api.example/graphql
        headers:
          Content-Type: application/json
          Authorization: Bearer ${ $secrets.API_TOKEN }
        body:
          query: |
            query GetUser($id: ID!) {
              user(id: $id) {
                id
                name
                email
                posts {
                  id
                  title
                  createdAt
                }
                followers {
                  totalCount
                }
              }
            }
          variables:
            id: ${ .userId }
      export:
        as: '${ $context + { graphqlResponse: . } }'
  - processUserData:
      set:
        userData: ${ $context.graphqlResponse.data.user }
        totalPosts: ${ length($context.graphqlResponse.data.user.posts) }
        followerCount: ${ $context.graphqlResponse.data.user.followers.totalCount }
