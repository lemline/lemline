document:
  dsl: '1.0.3'
  namespace: examples
  name: customer-graphql-query
  version: '1.0.0'
input:
  schema:
    format: json
    document:
      type: object
      required:
        - customerId
      properties:
        customerId:
          type: string
use:
  secrets:
    - API_TOKEN
do:
  - fetchCustomerData:
      call: http
      with:
        method: post
        endpoint: http://127.0.0.1:8787/graphql
        headers:
          Content-Type: application/json
          Authorization: Bearer ${ $secrets.API_TOKEN }
        body:
          query: |
            query GetCustomer($id: ID!) {
              customer(id: $id) {
                id
                name
                email
                reviews {
                  id
                  rating
                  title
                }
                orders {
                  totalCount
                }
              }
            }
          variables:
            id: ${ .customerId }
      export:
        as: '${ $context + { graphqlResponse: . } }'
  - processCustomerData:
      set:
        customerName: ${ $context.graphqlResponse.data.customer.name }
        totalReviews: ${ $context.graphqlResponse.data.customer.reviews | length }
        orderCount: ${ $context.graphqlResponse.data.customer.orders.totalCount }
