document:
  dsl: 1.0.3
  namespace: examples
  name: stream-processing
  version: 1.0.0
do:
  - processTelemetryStream:
      call: asyncapi
      with:
        document:
          endpoint: file:///apis/telemetry.asyncapi.json
        operation: subscribeTelemetry
        subscription:
          filter: '${ .deviceType == "sensor" }'
          consume:
            while: ${ true }
          foreach:
            item: reading
            do:
              - processReading:
                  try:
                    - analyzeTelemetry:
                        call: http
                        with:
                          method: post
                          endpoint: https://analytics.example/api/analyze
                          body: ${ $reading }
                    - triggerAlert:
                        if: ${ .alertRequired == true }
                        call: asyncapi
                        with:
                          document:
                            endpoint: file:///apis/telemetry.asyncapi.json
                          operation: publishAlert
                          message:
                            payload:
                              deviceId: ${ $reading.deviceId }
                              alertType: ${ .alertType }
                              severity: ${ .severity }
                              value: ${ $reading.value }
                              timestamp: ${ $reading.timestamp }
                  catch:
                    errors:
                      with:
                        type: https://open-workflow-specification.org/spec/1.0.0/errors/communication
                    retry:
                      delay:
                        seconds: 2
                      limit:
                        attempt:
                          count: 3
