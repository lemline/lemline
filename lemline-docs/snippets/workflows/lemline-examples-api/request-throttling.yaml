document:
  dsl: 1.0.0
  namespace: examples
  name: api-throttling
  version: 1.0.0
input:
  schema:
    format: json
    document:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            type: string
use:
  secrets:
    - API_TOKEN
do:
  - initializeContext:
      set:
        processedItems: []
        failures: []
      export:
        as: '${ $context + { processedItems: [], failures: [] } }'
  - processBatches:
      for:
        in: ${ chunk(.items, 5) }
        each: batch
      do:
        - processBatch:
            for:
              in: ${ $batch }
              each: item
            do:
              - processItem:
                  try:
                    - callRateLimitedAPI:
                        call: http
                        with:
                          method: get
                          endpoint: ${ "https://rate-limited-api.example/items/\($item)" }
                          headers:
                            Authorization: Bearer ${ $secrets.API_TOKEN }
                        export:
                          as: '${ $context + { processedItems: ($context.processedItems + [.itemResult])} }'
                  catch:
                    errors:
                      with:
                        type: https://open-workflow-specification.org/spec/1.0.0/errors/communication
                    as: apiError
                    retry:
                      when: ${ $apiError.status == 429 }
                      delay:
                        seconds: 10
                      backoff:
                        exponential: {}
                      limit:
                        attempt:
                          count: 3
                    do:
                      - recordFailure:
                          set:
                            failure:
                              item: ${ $item }
                              error: ${ $apiError }
                          export:
                            as: '${ $context + { failures: ($context.failures + [.failure]) } }'
        - throttleBetweenBatches:
            wait:
              seconds: 2
  - summarizeResults:
      set:
        result:
          succeeded: ${ length($context.processedItems) }
          failed: ${ length($context.failures) }
          processedItems: ${ $context.processedItems }
          failures: ${ $context.failures }
