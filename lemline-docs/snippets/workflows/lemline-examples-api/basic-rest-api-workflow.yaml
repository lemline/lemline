document:
  dsl: '1.0.3'
  namespace: examples
  name: register-customer
  version: '1.0.0'
input:
  schema:
    format: json
    document:
      type: object
      required:
        - email
        - name
      properties:
        email:
          type: string
          format: email
        name:
          type: string
use:
  secrets:
    - API_KEY
    - EMAIL_SERVICE_TOKEN
do:
  - validateEmail:
      call: http
      with:
        method: post
        endpoint: http://127.0.0.1:8787/email-checks
        body:
          email: ${ .email }
      export:
        as: '${ $context + { emailValidation: . } }'
  - createUserAccount:
      do:
        - route:
            switch:
              - validEmail:
                  when: ${ $context.emailValidation.valid == true }
                  then: validEmailAction
              - default:
                  then: defaultAction
        - validEmailAction:
            do:
              - registerUser:
                  call: http
                  with:
                    method: post
                    endpoint: http://127.0.0.1:8787/customers
                    headers:
                      Content-Type: application/json
                      X-API-Key: ${ $secrets.API_KEY }
                    body:
                      email: ${ $workflow.input.email }
                      name: ${ $workflow.input.name }
                  export:
                    as: '${ $context + { userAccount: . } }'
              - sendWelcomeEmail:
                  call: http
                  with:
                    method: post
                    endpoint: http://127.0.0.1:8787/notifications
                    headers:
                      Content-Type: application/json
                      Authorization: Bearer ${ $secrets.EMAIL_SERVICE_TOKEN }
                    body:
                      reference: ${ $context.userAccount.id }
                      recipient: ${ $workflow.input.email }
                      message: '${ "Welcome, " + $workflow.input.name }'
            then: exit
        - defaultAction:
            do:
              - notifyInvalidEmail:
                  set:
                    result:
                      success: false
                      reason: Invalid email address
                      email: ${ $context.emailValidation.email }
            then: exit
