document:
  dsl: 1.0.0
  namespace: examples
  name: user-registration
  version: 1.0.0
input:
  schema:
    format: json
    document:
      type: object
      required:
        - email
        - name
      properties:
        email:
          type: string
          format: email
        name:
          type: string
use:
  secrets:
    - API_KEY
    - EMAIL_SERVICE_TOKEN
do:
  - validateEmail:
      call: http
      with:
        method: post
        endpoint: https://validation.example/api/verify-email
        body:
          email: ${ .email }
      export:
        as: '${ $context + { emailValidation: . } }'
  - createUserAccount:
      do:
        - route:
            switch:
              - validEmail:
                  when: ${ $context.emailValidation.valid == true }
                  then: validEmailAction
              - default:
                  then: defaultAction
        - validEmailAction:
            do:
              - registerUser:
                  call: http
                  with:
                    method: post
                    endpoint: https://accounts.example/api/users
                    headers:
                      Content-Type: application/json
                      X-API-Key: ${ $secrets.API_KEY }
                    body:
                      email: ${ $workflow.input.email }
                      name: ${ $workflow.input.name }
                      verificationStatus: verified
                  export:
                    as: '${ $context + { userAccount: . } }'
              - sendWelcomeEmail:
                  call: http
                  with:
                    method: post
                    endpoint: https://notifications.example/api/emails
                    headers:
                      Content-Type: application/json
                      Authorization: Bearer ${ $secrets.EMAIL_SERVICE_TOKEN }
                    body:
                      template: welcome
                      recipient: ${ $workflow.input.email }
                      data:
                        name: ${ $workflow.input.name }
                        accountId: ${ $context.userAccount.id }
            then: exit
        - defaultAction:
            do:
              - notifyInvalidEmail:
                  set:
                    result:
                      success: false
                      reason: Invalid email address
                      details: ${ $context.emailValidation.reason }
            then: exit
