document:
  dsl: '1.0.3'
  namespace: examples
  name: add-review-mutation
  version: '1.0.0'
input:
  schema:
    format: json
    document:
      type: object
      required:
        - review
      properties:
        review:
          type: object
          required:
            - customerId
            - productId
            - rating
use:
  secrets:
    - API_TOKEN
do:
  - addReview:
      call: http
      with:
        method: post
        endpoint: http://127.0.0.1:8787/graphql
        headers:
          Content-Type: application/json
          Authorization: Bearer ${ $secrets.API_TOKEN }
        body:
          query: |
            mutation AddReview($review: ReviewInput!) {
              addReview(review: $review) {
                id
                rating
                title
              }
            }
          variables:
            review: ${ .review }
      export:
        as: '${ $context + { graphqlResponse: . } }'
  - processResult:
      do:
        - route:
            switch:
              - hasErrors:
                  when: ${ ($context.graphqlResponse.errors // []) | length > 0 }
                  then: hasErrorsAction
              - default:
                  then: defaultAction
        - hasErrorsAction:
            do:
              - handleErrors:
                  set:
                    result:
                      success: false
                      errors: ${ [$context.graphqlResponse.errors[].message] }
            then: exit
        - defaultAction:
            do:
              - handleSuccess:
                  set:
                    result:
                      success: true
                      review: ${ $context.graphqlResponse.data.addReview }
            then: exit
