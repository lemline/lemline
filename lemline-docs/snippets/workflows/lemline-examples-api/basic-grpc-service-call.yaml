document:
  dsl: 1.0.0
  namespace: examples
  name: grpc-integration
  version: 1.0.0
input:
  schema:
    format: json
    document:
      type: object
      required:
        - username
      properties:
        username:
          type: string
do:
  - greetUser:
      call: grpc
      with:
        proto:
          endpoint: file:///protos/greeter.proto
        service:
          name: Greeter
          host: grpc-example
          port: 50051
        method: SayHello
        arguments:
          name: ${ .username }
      export:
        as: '${ $context + { greeting: . } }'
  - getUserProfile:
      call: grpc
      with:
        proto:
          endpoint: file:///protos/user_service.proto
        service:
          name: UserService
          host: grpc-example
          port: 50051
        method: GetUserProfile
        arguments:
          username: ${ $workflow.input.username }
      export:
        as: '${ $context + { userProfile: . } }'
  - combineResults:
      set:
        result:
          greeting: ${ $context.greeting.message }
          profile:
            userId: ${ $context.userProfile.id }
            displayName: ${ $context.userProfile.displayName }
            email: ${ $context.userProfile.email }
            joinDate: ${ $context.userProfile.joinDate }
