document:
  dsl: '1.0.3'
  namespace: examples
  name: pack-order-items
  version: '0.1.0'
do:
  - packItems:
      for:
        each: item
        in: ${ $workflow.input.items }
        at: index
      while: ${ (.stop // false) | not }
      do:
        - waitForPacking:
            listen:
              to:
                one:
                  with:
                    type: com.example.item.packed
        - recordPacking:
            set:
              lastPacked: ${ $item.id }
              position: ${ $index }
              stop: ${ .[0].lastItem // false }
