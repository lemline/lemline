document:
  dsl: '1.0.3'
  namespace: examples
  name: stock-summary
  version: '1.0.0'
do:
  - check:
      do:
        - readShop:
            call: http
            with:
              method: get
              endpoint: http://127.0.0.1:8787/state
        - showAvailability:
            set:
              available: ${ .stock }
  - summarize:
      set:
        message: '${ "SKU-1 available: " + (.available | tostring) }'
