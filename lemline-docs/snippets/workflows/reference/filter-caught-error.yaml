document:
  dsl: '1.0.0'
  namespace: examples
  name: filter-caught-error
  version: '1.0.0'
do:
  - request:
      try:
        - callApi:
            call: http
            with:
              method: get
              endpoint: https://api.example.com/data
      catch:
        errors:
          with: { type: "https://open-workflow-specification.org/spec/1.0.0/errors/validation" }
        # Uses default 'error' variable -> $error
        exceptWhen: "${ $error.details | contains(\"userEmail\") }" # Don't catch if details mention userEmail
        do:
          - rejectInput:
              set:
                rejected: true
