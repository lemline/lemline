document:
  dsl: '1.0.0'
  namespace: examples
  name: use-function-catalog
  version: '1.0.0'
use:
  catalogs:
    workflows:
      endpoint: https://github.com/open-workflow-specification/catalog
do:
  - recordMessage:
      call: https://raw.githubusercontent.com/open-workflow-specification/catalog/main/functions/log/1.0.0/function.yaml
      with:
        message: ${ .message }
