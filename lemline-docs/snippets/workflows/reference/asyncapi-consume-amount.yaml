document:
  dsl: '1.0.0'
  namespace: examples
  name: asyncapi-consume-amount
  version: '1.0.0'
do:
  - consumeUpdates:
      call: asyncapi
      with:
        document:
          endpoint: https://events.example.com/asyncapi.yaml
        operation: getUpdates
        subscription:
          consume:
            amount: 5
