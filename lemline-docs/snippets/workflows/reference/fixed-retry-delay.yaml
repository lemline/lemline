document:
  dsl: '1.0.3'
  namespace: examples
  name: fixed-retry-delay
  version: '1.0.0'
do:
  - request:
      try:
        - callApi:
            call: http
            with:
              method: get
              endpoint: https://api.example.com/data
      catch:
        retry:
          delay: { seconds: 5 }
          limit:
            attempt:
              count: 4 # 1 initial + 3 retries
