document:
  dsl: '1.0.3'
  namespace: examples
  name: validate-and-route-order
  version: '1.0.0'
input:
  schema:
    format: json
    document:
      type: object
      required: [orderId, total]
      properties:
        orderId:
          type: string
        total:
          type: number
          minimum: 0
do:
  - routeOrder:
      switch:
        - largeOrder:
            when: ${ .total >= 1000 }
            then: requestReview
        - automatic:
            then: acceptOrder
  - requestReview:
      set:
        status: needs-review
      then: end
  - acceptOrder:
      set:
        status: accepted
output:
  as: '${ { orderId: $workflow.input.orderId, status: .status } }'
