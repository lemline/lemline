document:
  dsl: '1.0.3'
  namespace: examples
  name: listen-for-all-results
  version: '1.0.0'
do:
  - collectResults:
      listen:
        to:
          all:
            - with:
                type: com.example.inventory.checked
            - with:
                type: com.example.shipping.quoted
      timeout:
        after: PT5M
  - recordResults:
      set:
        checks: ${ . }
