document:
  dsl: '1.0.3'
  namespace: examples
  name: catch-type-and-status
  version: '1.0.0'
do:
  - request:
      try:
        - callApi:
            call: http
            with:
              method: get
              endpoint: https://api.example.com/data
      catch:
        errors:
          with:
            # Only catch errors of this specific type AND status
            type: "https://open-workflow-specification.org/spec/1.0.0/errors/communication"
            status: 503
            # instance: /do/0/request/try/0/callApi # Optionally match instance too
        # ... other catch properties (as, when, retry, do) ...
