document:
  dsl: '1.0.3'
  namespace: examples
  name: inline-email-check
  version: '1.0.0'
do:
  - validateEmail:
      run:
        script:
          language: python
          code: |
            import re
            import sys
            args = dict(zip(sys.argv[1::2], sys.argv[2::2]))
            valid = re.fullmatch(r"[^@\s]+@[^@\s]+\.[^@\s]+", args["email"])
            print("valid" if valid else "invalid")
          arguments:
            email: ${ .email }
        return: stdout
