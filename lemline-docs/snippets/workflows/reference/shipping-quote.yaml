document:
  dsl: '1.0.3'
  namespace: examples
  name: shipping-quote
  version: '1.0.0'
do:
  - requestQuote:
      call: http
      with:
        method: post
        endpoint: http://127.0.0.1:8787/quotes/economy
        body:
          orderId: ${ .orderId }
      output:
        as: '${ { orderId: .orderId, carrier: .carrier, price: .price } }'
