document:
  dsl: '1.0.3'
  namespace: examples
  name: bearer-authentication
  version: '1.0.0'
use:
  secrets:
    - apiToken
  authentications:
    partnerAuth:
      bearer:
        token: ${ $secrets.apiToken }
do:
  - getPartnerStock:
      call: http
      with:
        method: get
        endpoint:
          uri: http://127.0.0.1:8787/partner/stock
          authentication:
            use: partnerAuth
