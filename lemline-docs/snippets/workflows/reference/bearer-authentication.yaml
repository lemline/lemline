document:
  dsl: '1.0.3'
  namespace: examples
  name: bearer-authentication
  version: '1.0.0'
use:
  secrets:
    - apiToken
  authentications:
    catalogAuth:
      bearer:
        token: ${ $secrets.apiToken }
do:
  - getProducts:
      call: http
      with:
        method: get
        endpoint:
          uri: https://api.example.com/products
          authentication:
            use: catalogAuth
