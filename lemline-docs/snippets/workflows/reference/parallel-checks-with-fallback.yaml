document:
  dsl: '1.0.3'
  namespace: examples
  name: parallel-checks-with-fallback
  version: '1.0.0'
do:
  - attemptChecks:
      try:
        - checkOrder:
            fork:
              branches:
                - inventory:
                    call: http
                    with:
                      method: get
                      endpoint: http://127.0.0.1:8787/stock
                      query:
                        fail: '503'
                        failTimes: ${ .inventoryFailures // 0 | tostring }
                        key: ${ .orderId }
                - shipping:
                    call: http
                    with:
                      method: post
                      endpoint: http://127.0.0.1:8787/quotes/express
                      body:
                        orderId: ${ .orderId }
      catch:
        do:
          - requestManualReview:
              set:
                status: needs-review
