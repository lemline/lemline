document:
  dsl: '1.0.3'
  namespace: examples
  name: customer-registration
  version: '1.0.0'
input:
  schema:
    document:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
        email:
          type: string
do:
  - registerCustomer:
      call: http
      with:
        method: post
        endpoint: http://127.0.0.1:8787/customers
        body: '${ { name: .name, email: .email } }'
  - publishRegistrationEvent:
      emit:
        event:
          with:
            type: com.example.customer.registered
            source: https://events.example.com/customers
            subject: ${ .id }
            data:
              customerId: ${ .id }
