document:
  dsl: '1.0.3'
  namespace: examples
  name: format-error-result
  version: '1.0.0'
do:
  - submitOrder:
      try:
        - submit:
            call: http
            with:
              method: post
              endpoint: https://api.example.com/orders
              body: ${ . }
      catch:
        as: orderError
        do:
          - formatFailure:
              set:
                success: false
                status: ${ $orderError.status }
                errorType: ${ $orderError.type }
