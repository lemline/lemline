document:
  dsl: '1.0.0'
  namespace: examples
  name: retry-and-fallback
  version: '1.0.0'
use:
  retries:
    transient:
      delay: PT2S
      backoff:
        exponential: {}
      limit:
        attempt:
          count: 3
do:
  - fetchInventory:
      try:
        - requestInventory:
            call: http
            with:
              method: get
              endpoint: https://api.example.com/inventory
      catch:
        errors:
          with:
            status: 503
        retry: transient
        do:
          - useCachedInventory:
              set:
                inventory: []
                stale: true
