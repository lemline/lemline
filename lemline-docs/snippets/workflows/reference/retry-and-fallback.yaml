document:
  dsl: '1.0.3'
  namespace: examples
  name: retry-and-fallback
  version: '1.0.0'
use:
  retries:
    transient:
      delay: PT2S
      backoff:
        exponential: {}
      limit:
        attempt:
          count: 3
do:
  - fetchInventory:
      try:
        - requestInventory:
            call: http
            with:
              method: get
              endpoint: http://127.0.0.1:8787/stock
              query:
                fail: '503'
                failTimes: ${ .failures // 0 | tostring }
                key: ${ $workflow.id }
      catch:
        errors:
          with:
            type: https://open-workflow-specification.org/spec/1.0.0/errors/communication
            status: 503
        retry: transient
        do:
          - useCachedInventory:
              set:
                inventory: []
                stale: true
