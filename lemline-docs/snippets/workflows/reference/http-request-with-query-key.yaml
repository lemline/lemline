document:
  dsl: '1.0.3'
  namespace: examples
  name: http-request-with-query-key
  version: '1.0.0'
use:
  secrets:
    - apiKey
do:
  - getPartnerStock:
      call: http
      with:
        method: get
        endpoint: http://127.0.0.1:8787/partner/stock
        query:
          api_key: ${ $secrets.apiKey }
