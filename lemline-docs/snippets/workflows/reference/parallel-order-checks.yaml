document:
  dsl: '1.0.3'
  namespace: examples
  name: parallel-order-checks
  version: '1.0.0'
do:
  - checkOrder:
      fork:
        branches:
          - checkStock:
              call: http
              with:
                method: get
                endpoint: http://127.0.0.1:8787/stock
              output:
                as: '${ { available: .available } }'
          - checkShipping:
              call: http
              with:
                method: post
                endpoint: http://127.0.0.1:8787/quotes/express
                body: ${ . }
      output:
        as: '${ { checks: . } }'
