document:
  dsl: '1.0.3'
  namespace: examples
  name: schema-conditional-validation
  version: '1.0.0'
input:
  schema:
    document:
      type: object
      properties:
        paymentMethod:
          type: string
          enum:
            - CREDIT_CARD
            - BANK_TRANSFER
            - PAYPAL
        cardNumber:
          type: string
        expiryDate:
          type: string
        accountNumber:
          type: string
        routingNumber:
          type: string
        paypalEmail:
          type: string
      required:
        - paymentMethod
      if:
        properties:
          paymentMethod:
            enum:
              - CREDIT_CARD
        required:
          - paymentMethod
      then:
        required:
          - cardNumber
          - expiryDate
      else:
        if:
          properties:
            paymentMethod:
              enum:
                - BANK_TRANSFER
          required:
            - paymentMethod
        then:
          required:
            - accountNumber
            - routingNumber
        else:
          required:
            - paypalEmail
do:
  - example:
      set:
        ready: true
