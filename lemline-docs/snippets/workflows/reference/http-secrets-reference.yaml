document:
  dsl: '1.0.3'
  namespace: examples
  name: http-secrets-reference
  version: '1.0.0'
use:
  secrets:
    - PARTNER_TOKEN
do:
  - fetch:
      call: http
      with:
        method: get
        endpoint:
          uri: http://127.0.0.1:8787/partner/stock
          authentication:
            bearer:
              token: ${ $secrets.PARTNER_TOKEN }
