document:
  dsl: '1.0.3'
  namespace: examples
  name: http-secrets-reference
  version: '1.0.0'
use:
  secrets:
    - PAYMENT_API_KEY
do:
  - fetch:
      call: http
      with:
        method: get
        endpoint:
          uri: https://payments.example.com/v1/charges
          authentication:
            bearer:
              token: ${ $secrets.PAYMENT_API_KEY }
