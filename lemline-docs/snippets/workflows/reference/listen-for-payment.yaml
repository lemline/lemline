document:
  dsl: '1.0.3'
  namespace: examples
  name: listen-for-payment
  version: '1.0.0'
do:
  - awaitPayment:
      listen:
        to:
          one:
            with:
              type: com.example.payment.received
            correlate:
              orderId:
                from: ${ .orderId }
                expect: ${ $workflow.input.orderId }
      timeout:
        after: PT30M
