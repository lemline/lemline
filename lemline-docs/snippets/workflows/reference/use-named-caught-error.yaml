document:
  dsl: '1.0.0'
  namespace: examples
  name: use-named-caught-error
  version: '1.0.0'
do:
  - request:
      try:
        - callApi:
            call: http
            with:
              method: get
              endpoint: https://api.example.com/data
      catch:
        errors:
          with: { type: "https://open-workflow-specification.org/spec/1.0.0/errors/communication" }
        as: "commErr" # Optional, using 'commErr' instead of default 'error'
        when: "${ $commErr.instance == \"/do/0/request/try/0/callApi\" }"
        # ... retry or do ...
