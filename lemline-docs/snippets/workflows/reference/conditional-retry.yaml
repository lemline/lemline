document:
  dsl: '1.0.0'
  namespace: examples
  name: conditional-retry
  version: '1.0.0'
do:
  - request:
      try:
        - callApi:
            call: http
            with:
              method: get
              endpoint: https://api.example.com/data
      catch:
        retry:
          when: "${ $error.details | contains(\"timeout\") }" # Only retry on timeouts
          delay: { seconds: 10 }
          limit:
            attempt:
              count: 3
