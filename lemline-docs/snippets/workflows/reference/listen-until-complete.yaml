document:
  dsl: '1.0.0'
  namespace: examples
  name: listen-until-complete
  version: '1.0.0'
do:
  - collectUpdates:
      listen:
        to:
          any:
            - with:
                type: com.example.order.updated
          until:
            one:
              with:
                type: com.example.order.completed
      timeout:
        after: PT30M
