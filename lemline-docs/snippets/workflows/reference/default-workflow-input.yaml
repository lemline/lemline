document:
  dsl: '1.0.3'
  namespace: examples
  name: default-workflow-input
  version: '1.0.0'
do:
  - recordOrder:
      input:
        from: '${ { priority: "NORMAL", currency: "USD" } + . }'
      set:
        orderId: ${ .orderId }
        priority: ${ .priority }
        currency: ${ .currency }
