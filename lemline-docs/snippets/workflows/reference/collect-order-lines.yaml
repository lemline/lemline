document:
  dsl: '1.0.3'
  namespace: examples
  name: collect-order-lines
  version: '1.0.0'
do:
  - calculateLines:
      input:
        from: '${ { lines: [] } }'
      for:
        each: item
        in: ${ $workflow.input.items }
      do:
        - appendLine:
            set:
              lines: '${ .lines + [{ id: $item.id, amount: ($item.price * $item.quantity) }] }'
