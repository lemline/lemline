document:
  dsl: '1.0.3'
  namespace: examples
  name: order-review-routing
  version: '1.0.0'
do:
  - obtainCustomerRecord:
      call: http
      with:
        method: get
        endpoint: '${ "http://127.0.0.1:8787/customers/" + .customerId }'
  - routeOrder:
      switch:
        - needsReview:
            when: ${ .emailValid == false or .tier != "gold" }
            then: manualReview
        - otherwise:
            then: automaticReview
  - manualReview:
      set:
        queue: manual-review
      then: end
  - automaticReview:
      set:
        queue: automatic-review
