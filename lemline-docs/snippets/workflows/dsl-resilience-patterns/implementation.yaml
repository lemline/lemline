document:
  dsl: '1.0.3'
  namespace: examples
  name: resilience-retry
  version: '1.0.0'
do:
  - callService:
      try:
        - request:
            call: http
            with:
              method: get
              endpoint: http://127.0.0.1:8787/stock
              query:
                fail: '503'
                failTimes: ${ .failures // 0 | tostring }
                key: ${ $workflow.id }
      catch:
        errors:
          with:
            type: https://open-workflow-specification.org/spec/1.0.0/errors/runtime
        retry:
          delay:
            seconds: 2
          backoff:
            exponential: {}
          jitter:
            from:
              milliseconds: 0
            to:
              milliseconds: 500
          limit:
            attempt:
              count: 5
            duration:
              minutes: 5
