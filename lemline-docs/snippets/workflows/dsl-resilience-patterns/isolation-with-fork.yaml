document:
  dsl: '1.0.3'
  namespace: examples
  name: resilience-fork-isolation
  version: 1.0.0
do:
  - processBatch:
      fork:
        branches:
          - updateInventory:
              try:
                - reserveStock:
                    call: http
                    with:
                      method: post
                      endpoint: http://127.0.0.1:8787/reservations
                      body:
                        orderId: ${ .orderId }
                        items: ${ .items }
                    output:
                      as: '${ { inventoryUpdated: true } }'
              catch:
                do:
                  - ignore:
                      set:
                        inventoryUpdated: false
          - notifyCustomer:
              call: http
              with:
                method: post
                endpoint: http://127.0.0.1:8787/notifications
                body:
                  reference: ${ .orderId }
                  recipient: customer
                  message: Order received
