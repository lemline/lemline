document:
  dsl: '1.0.3'
  namespace: examples
  name: resilience-listen-timeout
  version: '1.0.0'
do:
  - waitForPayment:
      try:
        - listenPayment:
            listen:
              to:
                one:
                  with:
                    type: com.example.payment.received
            timeout:
              after:
                seconds: 30
      catch:
        errors:
          with:
            type: https://open-workflow-specification.org/spec/1.0.0/errors/timeout
        do:
          - cancelOrder:
              set:
                status: cancelled
