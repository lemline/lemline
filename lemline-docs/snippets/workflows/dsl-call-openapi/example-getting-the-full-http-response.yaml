document:
  dsl: '1.0.0'
  namespace: examples
  name: example-getting-the-full-http-response
  version: '1.0.0'
do:
  - getPetAndCheckHeaders:
      call: openapi
      with:
        document:
          endpoint:
            uri: "https://petstore.swagger.io/v2/swagger.json"
        operationId: "getPetById"
        parameters:
          petId: "${ .targetPetId }"
        output: response
      then: analyzeHttpResponse
  - analyzeHttpResponse:
      set:
        petData: "${ .body }"
        contentType: '${ .headers["Content-Type"] }'
