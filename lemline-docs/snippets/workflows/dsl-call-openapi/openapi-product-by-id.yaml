document:
  dsl: '1.0.3'
  namespace: examples
  name: openapi-product-by-id
  version: '1.0.0'
do:
  - request:
      call: openapi
      with:
        document:
          endpoint: http://127.0.0.1:8787/openapi.json
        operationId: getProduct
        parameters:
          productId: ${ .productId }
