document:
  dsl: '1.0.3'
  namespace: examples
  name: grpc-auth-example
  version: '0.1.0'
use:
  secrets:
    - apiToken
  authentications:
    inventoryAuth:
      bearer:
        token: ${ $secrets.apiToken }
do:
  - getStock:
      call: grpc
      with:
        proto:
          endpoint: file:///opt/shop/inventory.proto
        service:
          name: shop.InventoryService
          host: localhost
          port: 50051
          authentication:
            use: inventoryAuth
        method: GetStock
        arguments:
          sku: ${ .sku }
  - recordStock:
      set:
        checked: true
