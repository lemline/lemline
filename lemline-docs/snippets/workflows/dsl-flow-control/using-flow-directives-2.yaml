document:
  dsl: 1.0.3
  namespace: examples
  name: using-flow-directives-2
  version: 1.0.0
do:
  - criticalCheck:
      call: getSystemStatus
  - decideTermination:
      set:
        processed: true
      if: '${ .status == "FATAL" }'
      then: end
  - continueNormalProcessing:
      set:
        processed: true
