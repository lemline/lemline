document:
  dsl: '1.0.3'
  namespace: examples
  name: using-flow-directives-2
  version: '1.0.0'
do:
  - decideTermination:
      if: ${ .status == "FATAL" }
      set:
        status: halted
      then: end
  - continueNormalProcessing:
      set:
        status: continued
output:
  as: '${ {result: .status} }'
