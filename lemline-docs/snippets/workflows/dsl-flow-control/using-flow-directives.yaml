document:
  dsl: '1.0.3'
  namespace: examples
  name: using-flow-directives
  version: '1.0.0'
do:
  - parent:
      do:
        - shortCircuit:
            if: ${ .status == "done" }
            set:
              route: already-done
            then: exit
        - processNormally:
            set:
              route: processed
      then: finish
  - skippedOuter:
      set:
        route: unexpected
  - finish:
      set:
        route: ${ .route }
        reachedParent: true
