document:
  dsl: '1.0.3'
  namespace: examples
  name: conditional-execution-the-if-property
  version: '1.0.0'
do:
  - expedited:
      if: ${ .expedite }
      set:
        route: express
      then: finish
  - standard:
      set:
        route: economy
  - finish:
      set:
        carrier: ${ .route }
