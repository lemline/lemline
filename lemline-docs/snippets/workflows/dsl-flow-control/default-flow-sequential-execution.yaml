document:
  dsl: '1.0.3'
  namespace: examples
  name: default-flow-sequential-execution
  version: '1.0.0'
do:
  - validateOrder:
      set:
        orderId: ${ .orderId }
        valid: true
  - checkInventory:
      set:
        orderId: ${ .orderId }
        ready: ${ .valid }
  - processPayment:
      set:
        orderId: ${ .orderId }
        paid: ${ .ready }
