document:
  dsl: '1.0.3'
  namespace: examples
  name: targeting-a-specific-task-2
  version: '1.0.0'
do:
  - parent:
      do:
        - finishInner:
            set:
              inner: complete
            then: exit
        - skippedInner:
            set:
              inner: unexpected
  - finishOuter:
      set:
        inner: ${ .inner }
        outer: complete
