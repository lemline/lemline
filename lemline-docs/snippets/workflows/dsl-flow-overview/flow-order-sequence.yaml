document:
  dsl: '1.0.3'
  namespace: examples
  name: flow-order-sequence
  version: '1.0.0'
do:
  - processOrder:
      do:
        - reserve:
            call: http
            with:
              method: post
              endpoint: http://127.0.0.1:8787/reservations
              body:
                orderId: ${ .orderId }
                items: ${ .items }
        - charge:
            call: http
            with:
              method: post
              endpoint: http://127.0.0.1:8787/charges
              body:
                orderId: ${ .orderId }
                paymentInfo:
                  token: approved
        - receipt:
            set:
              orderId: ${ .orderId }
              paid: ${ .paid }
              amount: ${ .amount }
