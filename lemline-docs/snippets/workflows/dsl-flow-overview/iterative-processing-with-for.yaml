document:
  dsl: 1.0.3
  namespace: examples
  name: process-order-items
  version: 1.0.0
use:
  functions:
    inventoryUpdater:
      set:
        processed: true
    orderItemTracker:
      set:
        processed: true
do:
  - processItems:
      for:
        in: ${ .input.order.items }
        each: currentItem
      do:
        - updateInventory:
            call: inventoryUpdater
            with:
              args:
                productId: ${ $currentItem.productId }
                quantity: ${ $currentItem.quantity }
                operation: DECREMENT
        - recordItemFulfillment:
            call: orderItemTracker
            with:
              args:
                orderId: ${ .input.order.id }
                itemId: ${ $currentItem.id }
                status: FULFILLED
