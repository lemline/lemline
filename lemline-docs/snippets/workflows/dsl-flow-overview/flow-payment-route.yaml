document:
  dsl: '1.0.3'
  namespace: examples
  name: flow-payment-route
  version: '1.0.0'
do:
  - route:
      switch:
        - card:
            when: ${ .method == "card" }
            then: processCard
        - other:
            then: manualReview
  - processCard:
      set:
        route: automatic
      then: exit
  - manualReview:
      set:
        route: review
