document:
  dsl: 1.0.3
  namespace: examples
  name: product-data-enrichment
  version: 1.0.0
use:
  functions:
    pricingService:
      set:
        processed: true
    inventoryService:
      set:
        processed: true
    reviewService:
      set:
        processed: true
do:
  - enrichProductData:
      fork:
        branches:
          - fetchPricing:
              call: pricingService
              with:
                args:
                  productId: ${ $workflow.input.productId }
          - fetchInventory:
              call: inventoryService
              with:
                args:
                  productId: ${ $workflow.input.productId }
          - fetchReviews:
              call: reviewService
              with:
                args:
                  productId: ${ $workflow.input.productId }
        compete: false
