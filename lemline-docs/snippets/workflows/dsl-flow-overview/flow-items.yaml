document:
  dsl: '1.0.3'
  namespace: examples
  name: flow-items
  version: '1.0.0'
do:
  - processItems:
      for:
        in: ${ .items }
        each: line
      do:
        - lineTotal:
            set:
              productId: ${ $line.productId }
              amount: ${ $line.quantity * $line.price }
