document:
  dsl: '1.0.3'
  namespace: examples
  name: process-new-order
  version: '1.0.0'
use:
  functions:
    lookupCustomer:
      call: http
      with:
        method: get
        endpoint: '${ "http://127.0.0.1:8787/customers/" + (.customerId | @uri) }'
    reserveItems:
      call: http
      with:
        method: post
        endpoint: http://127.0.0.1:8787/reservations
        body:
          orderId: ${ .orderId }
          items: ${ .items }
    collectPayment:
      call: http
      with:
        method: post
        endpoint: http://127.0.0.1:8787/charges
        body:
          orderId: ${ .orderId }
          paymentInfo:
            token: ${ .paymentToken }
do:
  - confirmCustomer:
      call: lookupCustomer
      with:
        customerId: ${ .customerId }
      then: reserve
  - reserve:
      call: reserveItems
      with:
        orderId: ${ $workflow.input.orderId }
        items: ${ $workflow.input.items }
      then: pay
  - pay:
      call: collectPayment
      with:
        orderId: ${ .orderId }
        paymentToken: ${ $workflow.input.paymentToken }
  - receipt:
      set:
        orderId: ${ .orderId }
        paid: ${ .paid }
        amount: ${ .amount }
