document:
  dsl: 1.0.0
  namespace: examples
  name: compensating-transaction
  version: 0.1.0
do:
  - processOrder:
      try:
        - reserveInventory:
            call: http
            with:
              method: post
              endpoint: https://inventory.example.com/api/reserve
              body: ${ .orderItems }
            export:
              as: '${ $context + { inventoryReservation: . } }'
        - processPayment:
            call: http
            with:
              method: post
              endpoint: https://payments.example.com/api/charge
              body: ${ $workflow.input.paymentDetails }
      catch:
        errors:
          with:
            type: https://example.com/errors/payment
        as: paymentError
        do:
          - cancelReservation:
              call: http
              with:
                method: post
                endpoint: https://inventory.example.com/api/cancel-reservation
                body: ${ $context.inventoryReservation.id }
          - notifyCustomer:
              call: http
              with:
                method: post
                endpoint: https://notifications.example.com/api/send
                body:
                  customerId: ${ $workflow.input.customerId }
                  message: '${ "Payment failed: " + $paymentError.details }'
