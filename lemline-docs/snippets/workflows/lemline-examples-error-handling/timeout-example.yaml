document:
  dsl: '1.0.3'
  namespace: examples
  name: timeout-handling
  version: '1.0.0'
do:
  - callWithTimeout:
      try:
        - longRunningOperation:
            call: http
            with:
              method: get
              endpoint: http://127.0.0.1:8787/stock
              query:
                delayMs: '5000'
            timeout:
              after:
                seconds: 2
      catch:
        errors:
          with:
            type: https://open-workflow-specification.org/spec/1.0.0/errors/timeout
        as: timeoutError
        do:
          - handleTimeout:
              set:
                status: timeout
                message: Operation timed out after 2 seconds
              then: exit
