document:
  dsl: '1.0.3'
  namespace: default
  name: try-catch-retry
  version: '0.1.0'
use:
  retries:
    default:
      delay:
        seconds: 3
      backoff:
        exponential: {}
      limit:
        attempt:
          count: 5
do:
  - tryGetPet:
      try:
        - getPet:
            call: http
            with:
              method: get
              endpoint: '${ "https://petstore.swagger.io/v2/pet/" + ($workflow.input.petId | tostring) }'
      catch:
        when: ${ $error.title | startswith("HTTP 503") }
        retry: default
