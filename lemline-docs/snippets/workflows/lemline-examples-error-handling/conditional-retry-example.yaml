document:
  dsl: '1.0.3'
  namespace: examples
  name: conditional-retry
  version: '1.0.0'
do:
  - tryReadStock:
      try:
        - readStock:
            call: http
            with:
              method: get
              endpoint: http://127.0.0.1:8787/stock
              query:
                fail: ${ .failStatus | tostring }
                failTimes: '1'
                key: ${ $workflow.id }
      catch:
        errors:
          with:
            type: https://open-workflow-specification.org/spec/1.0.0/errors/runtime
        as: stockError
        retry:
          when: '${ $stockError.title | test("^HTTP (5[0-9][0-9]|429)") }'
          delay:
            seconds: 2
          backoff:
            exponential: {}
          limit:
            attempt:
              count: 3
