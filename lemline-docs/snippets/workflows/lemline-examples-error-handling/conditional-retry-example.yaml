document:
  dsl: '1.0.3'
  namespace: examples
  name: conditional-retry
  version: '0.1.0'
do:
  - tryProcessPayment:
      try:
        - processPayment:
            call: http
            with:
              method: post
              endpoint: https://payments.example.com/api/process
              body: ${ .paymentDetails }
      catch:
        errors:
          with:
            type: https://open-workflow-specification.org/spec/1.0.0/errors/runtime
        as: paymentError
        retry:
          when: '${ $paymentError.title | test("^HTTP (5[0-9][0-9]|429)") }'
          delay:
            seconds: 2
          backoff:
            exponential: {}
          limit:
            attempt:
              count: 3
