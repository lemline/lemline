document:
  dsl: '1.0.3'
  namespace: default
  name: try-catch
  version: '0.1.0'
do:
  - tryGetPet:
      try:
        - getPet:
            call: http
            with:
              method: get
              endpoint: '${ "https://petstore.swagger.io/v2/pet/" + ($workflow.input.petId | tostring) }'
      catch:
        when: ${ $error.title | startswith("HTTP 404") }
