document:
  dsl: '1.0.3'
  namespace: examples
  name: circuit-breaker
  version: '1.0.0'
use:
  retries:
    circuitBreaker:
      backoff:
        exponential: {}
      delay:
        seconds: 1
      limit:
        attempt:
          count: 3
do:
  - callExternalService:
      try:
        - makeApiCall:
            call: http
            with:
              method: get
              endpoint: http://127.0.0.1:8787/stock
              query:
                fail: '503'
                key: ${ $workflow.id }
      catch:
        errors:
          with:
            type: https://open-workflow-specification.org/spec/1.0.0/errors/communication
        retry: circuitBreaker
