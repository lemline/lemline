document:
  dsl: '1.0.3'
  namespace: examples
  name: correlate-shipment-provider
  version: '1.0.0'
do:
  - awaitEvent:
      listen:
        to:
          one:
            with:
              type: com.example.carrier.confirmed
            correlate:
              sameShipment:
                from: ${ .confirmation.shipment }
                expect: ${ $workflow.input.shipment }
              sameProvider:
                from: ${ .confirmation.provider }
                expect: ${ $workflow.input.provider }
      timeout:
        after: PT2M
