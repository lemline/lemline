document:
  dsl: 1.0.0
  namespace: system-monitor
  name: wait-for-component-ready
  version: 1.0.0
do:
  - waitForComponentReady:
      listen:
        to:
          one:
            with:
              type: com.system.status.update.v1
              source: http://systems/monitoring/component-abc
            correlate:
              matchComponentStatus:
                from: ${ .status }
                expect: Ready
  - componentIsReady:
      set:
        processed: true
