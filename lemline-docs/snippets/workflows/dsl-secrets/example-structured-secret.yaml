document:
  dsl: '1.0.3'
  namespace: examples
  name: example-structured-secret
  version: '1.0.0'
use:
  secrets:
    - DB_CREDENTIALS   # e.g. {"username": "app", "password": "s3cr3t"}
do:
  - openSession:
      call: http
      with:
        method: post
        endpoint: https://db-proxy.example.com/sessions
        body:
          user: ${ $secrets.DB_CREDENTIALS.username }
          password: ${ $secrets.DB_CREDENTIALS.password }
