document:
  dsl: '1.0.3'
  namespace: examples
  name: example-structured-secret
  version: '1.0.0'
use:
  secrets:
    - SHOP_CREDENTIALS
do:
  - readPartnerStock:
      call: http
      with:
        method: get
        endpoint:
          uri: http://127.0.0.1:8787/partner/stock
          authentication:
            basic:
              username: ${ $secrets.SHOP_CREDENTIALS.username }
              password: ${ $secrets.SHOP_CREDENTIALS.password }
