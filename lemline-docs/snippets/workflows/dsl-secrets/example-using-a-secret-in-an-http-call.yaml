document:
  dsl: '1.0.3'
  namespace: examples
  name: example-using-a-secret-in-an-http-call
  version: '1.0.0'
use:
  secrets:
    - API_KEY
do:
  - readPartnerStock:
      call: http
      with:
        method: get
        endpoint: http://127.0.0.1:8787/partner/stock
        headers:
          X-API-Key: ${ $secrets.API_KEY }
