document:
  dsl: '1.0.0'
  namespace: examples
  name: example-using-a-secret-in-an-http-call
  version: '1.0.0'
use:
  secrets:
    - API_KEY
do:
  - callProtectedAPI:
      call: http
      with:
        method: post
        endpoint: https://api.example.com/data
        headers:
          Authorization: '${ "Bearer " + $secrets.API_KEY }'
