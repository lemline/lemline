document:
  dsl: '1.0.3'
  namespace: examples
  name: example-secret-in-an-authentication-policy
  version: '1.0.0'
use:
  secrets:
    - API_TOKEN
do:
  - callProtectedAPI:
      call: http
      with:
        method: get
        endpoint:
          uri: https://api.example.com/data
          authentication:
            bearer:
              token: ${ $secrets.API_TOKEN }
