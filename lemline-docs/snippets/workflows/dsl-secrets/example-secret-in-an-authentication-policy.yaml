document:
  dsl: '1.0.3'
  namespace: examples
  name: example-secret-in-an-authentication-policy
  version: '1.0.0'
use:
  secrets:
    - API_TOKEN
  authentications:
    shopToken:
      bearer:
        token: ${ $secrets.API_TOKEN }
do:
  - readPartnerStock:
      call: http
      with:
        method: get
        endpoint:
          uri: http://127.0.0.1:8787/partner/stock
          authentication:
            use: shopToken
