document:
  dsl: '1.0.3'
  namespace: examples
  name: business-rule-validation
  version: '1.0.0'
do:
  - readStock:
      call: http
      with:
        method: get
        endpoint: http://127.0.0.1:8787/stock
  - checkAvailableQuantity:
      if: ${ .available < $workflow.input.quantity }
      raise:
        error:
          type: https://errors.example.com/insufficient-stock
          title: Insufficient stock
          status: 409
  - accept:
      set:
        accepted: true
