document:
  dsl: '1.0.3'
  namespace: examples
  name: retry-logic
  version: '1.0.0'
do:
  - retryTask:
      try:
        - makeHttpCall:
            call: http
            with:
              method: "POST"
              endpoint: "https://external-api.example.com/process"
              headers:
                Content-Type: "application/json"
                Authorization: ${ "Bearer " + $secrets.apiKey }
              body: ${ .requestData }
      catch:
        as: error
        errors:
          with:
            type: "PERMISSION_DENIED"
        retry:
          when: '${ $error.code == "UNAVAILABLE" or $error.code == "RESOURCE_EXHAUSTED" }'
          delay: PT2S
          backoff:
            exponential:
              multiplier: 2
              maxDelay: PT10S
          limit:
            attempt:
              count: 3
        do:
          - refreshCredentials:
              call: credentialRefresher
              with:
                run:
                  script:
                    language: javascript
                    code: |
                      function credentialRefresher(currentKey) {
                        // Implementation of credential refresh logic
                        return { apiKey: "new-api-key" };
                      }
                    arguments:
                      currentKey: ${ .input.apiKey }
                  return: stdout
          - retryHttpCall:
              call: http
              with:
                method: "POST"
                endpoint: "https://external-api.example.com/process"
                headers:
                  Content-Type: "application/json"
                  Authorization: ${ "Bearer " + .newCredentials.apiKey }
                body: ${ .input.requestData }
