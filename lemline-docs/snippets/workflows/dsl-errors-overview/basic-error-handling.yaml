document:
  dsl: '1.0.3'
  namespace: examples
  name: basic-error-handling
  version: '1.0.0'
do:
  - requestProduct:
      try:
        - read:
            call: http
            with:
              method: get
              endpoint: '${ "http://127.0.0.1:8787/products/" + (.productId | @uri) }'
            output:
              as: '${ {listed: true, productId: .id} }'
      catch:
        errors:
          with:
            type: https://open-workflow-specification.org/spec/1.0.0/errors/communication
            status: 404
        do:
          - unavailable:
              set:
                listed: false
