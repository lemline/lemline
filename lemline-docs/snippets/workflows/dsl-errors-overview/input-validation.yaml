document:
  dsl: '1.0.3'
  namespace: examples
  name: input-validation
  version: '1.0.0'
do:
  - validateQuantity:
      if: ${ .quantity < 1 }
      raise:
        error:
          type: https://errors.example.com/invalid-quantity
          title: Quantity must be positive
          status: 400
  - accept:
      set:
        accepted: true
