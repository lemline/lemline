document:
  dsl: '1.0.3'
  namespace: examples
  name: combining-try-and-raise
  version: '1.0.0'
do:
  - processOrder:
      try:
        - checkOrderData:
            if: ${ (.items // []) | length == 0 }
            raise:
              error:
                type: https://example.com/errors/invalid-order
                status: 400
                title: Order must contain at least one item
        - processPayment:
            call: http
            with:
              method: post
              endpoint: https://api.example.com/payments/process
              body: ${ . }
      catch:
        as: orderError
        do:
          - formatFailure:
              set:
                success: false
                status: ${ $orderError.status }
                errorType: ${ $orderError.type }
