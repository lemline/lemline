document:
  dsl: '1.0.3'
  namespace: examples
  name: combining-try-and-raise
  version: '1.0.0'
do:
  - processOrder:
      try:
        - rejectEmptyOrder:
            if: ${ .items | length == 0 }
            raise:
              error:
                type: https://errors.example.com/invalid-order
                title: Order has no items
                status: 400
        - reserveStock:
            call: http
            with:
              method: post
              endpoint: http://127.0.0.1:8787/reservations
              body:
                orderId: ${ .orderId }
                items: ${ .items }
        - charge:
            call: http
            with:
              method: post
              endpoint: http://127.0.0.1:8787/charges
              body:
                orderId: ${ .orderId }
                paymentInfo:
                  token: ${ $workflow.input.paymentToken }
            output:
              as: '${ {paid: .paid} }'
      catch:
        as: orderError
        do:
          - reportError:
              set:
                paid: false
                status: ${ $orderError.status }
