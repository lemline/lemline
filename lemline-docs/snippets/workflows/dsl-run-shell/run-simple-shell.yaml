document:
  dsl: '1.0.3'
  namespace: examples
  name: run-simple-shell
  version: '1.0.0'
do:
  - greet:
      run:
        shell:
          command: sh
          arguments:
            - '-c'
            - 'printf "%s" "$ORDER_ID"'
          environment:
            ORDER_ID: ${ .orderId }
        return: stdout
  - result:
      set:
        orderId: ${ . }
