document:
  dsl: '1.0.3'
  namespace: examples
  name: shell-capture-all
  version: '1.0.0'
do:
  - writeReceipt:
      run:
        shell:
          command: sh
          arguments:
            - '-c'
            - 'printf "%s" "$1"; printf "sample run" >&2'
            - 'receipt'
            - '${ .message }'
        return: all
  - result:
      set:
        code: ${ .code }
        stdout: ${ .stdout }
        stderr: ${ .stderr }
