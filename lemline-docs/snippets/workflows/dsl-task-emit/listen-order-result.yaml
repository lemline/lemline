document:
  dsl: '1.0.3'
  namespace: examples
  name: listen-order-result
  version: '1.0.0'
do:
  - receive:
      listen:
        to:
          any:
            - with:
                type: com.example.order.reserved
                source: http://127.0.0.1:8787/orders
              correlate:
                orderId:
                  from: ${ .orderId }
                  expect: ${ $workflow.input.orderId }
            - with:
                type: com.example.order.rejected
                source: http://127.0.0.1:8787/orders
              correlate:
                orderId:
                  from: ${ .orderId }
                  expect: ${ $workflow.input.orderId }
        read: envelope
      timeout:
        after: PT2M
      output:
        as: '${ .[0] | {type, subject, data} }'
