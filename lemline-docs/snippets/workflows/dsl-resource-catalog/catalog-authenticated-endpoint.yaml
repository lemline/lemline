document:
  dsl: '1.0.3'
  namespace: examples
  name: catalog-authenticated-endpoint
  version: '1.0.0'
use:
  catalogs:
    public:
      endpoint: http://127.0.0.1:8787/catalog
    private:
      endpoint:
        uri: http://127.0.0.1:8787/catalog
        authentication:
          basic:
            username: demo
            password: demo-password
do:
  - readPublicProduct:
      call: get-product:1.0.0@public
      with:
        productId: SKU-1
  - readPrivateProduct:
      call: get-product:1.0.0@private
      with:
        productId: SKU-2
