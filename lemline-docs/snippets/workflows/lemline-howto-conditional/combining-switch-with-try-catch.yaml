document:
  dsl: '1.0.3'
  namespace: examples
  name: combining-switch-with-try-catch
  version: '1.0.0'
do:
  - reserveStock:
      call: http
      with:
        method: post
        endpoint: http://127.0.0.1:8787/reservations
        body:
          orderId: ${ .orderId }
          items: [{ id: SKU-1, quantity: 1 }]
  - processOrder:
      try:
        - attemptPayment:
            call: http
            with:
              method: post
              endpoint: http://127.0.0.1:8787/charges
              query:
                fail: '503'
                failTimes: ${ $workflow.input.failures // 0 | tostring }
              body:
                orderId: ${ $workflow.input.orderId }
                paymentInfo:
                  token: ${ $workflow.input.token }
        - evaluatePayment:
            switch:
              - success:
                  when: ${ .status == "approved" }
                  then: completeOrder
              - review:
                  when: ${ .status == "review" }
                  then: flagForReview
              - default:
                  then: handleFailure
        - completeOrder:
            set:
              orderStatus: completed
            then: exit
        - flagForReview:
            set:
              orderStatus: in-review
            then: exit
        - handleFailure:
            set:
              orderStatus: payment-failed
      catch:
        retry:
          delay:
            seconds: 1
          limit:
            attempt:
              count: 3
        do:
          - handleError:
              set:
                orderStatus: error
