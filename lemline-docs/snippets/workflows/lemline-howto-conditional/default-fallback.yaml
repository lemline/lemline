document:
  dsl: '1.0.3'
  namespace: examples
  name: default-fallback
  version: '1.0.0'
do:
  - checkOrderStatus:
      switch:
        - approved:
            when: ${ .status == "approved" }
            then: processApprovedOrder
        - pending:
            when: ${ .status == "pending" }
            then: waitForApproval
        - rejected:
            when: ${ .status == "rejected" }
            then: handleRejectedOrder
        - unknown:
            then: handleUnknownStatus
  - processApprovedOrder:
      set:
        next: ship
      then: exit
  - waitForApproval:
      set:
        next: wait
      then: exit
  - handleRejectedOrder:
      set:
        next: cancel
      then: exit
  - handleUnknownStatus:
      set:
        next: investigate
