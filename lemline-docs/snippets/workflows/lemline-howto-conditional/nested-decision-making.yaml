document:
  dsl: '1.0.3'
  namespace: examples
  name: nested-decision-making
  version: '1.0.0'
do:
  - evaluateRiskLevel:
      switch:
        - highValue:
            when: ${ .transaction.amount > 10000 }
            then: highValueCheck
        - other:
            then: standardCheck
  - highValueCheck:
      switch:
        - flagged:
            when: ${ .customer.history.flags | length > 0 }
            then: manualReview
        - established:
            when: ${ .customer.accountAgeDays >= 90 }
            then: autoApprove
        - recent:
            then: additionalVerification
  - manualReview:
      set:
        decision: manual-review
      then: exit
  - additionalVerification:
      set:
        decision: verification
      then: exit
  - autoApprove:
      set:
        decision: approved
      then: exit
  - standardCheck:
      set:
        decision: standard
