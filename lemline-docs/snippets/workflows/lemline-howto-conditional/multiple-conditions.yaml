document:
  dsl: '1.0.3'
  namespace: examples
  name: multiple-conditions
  version: '1.0.0'
do:
  - assignLoyaltyTier:
      switch:
        - gold:
            when: ${ .points >= 80 }
            then: setGold
        - silver:
            when: ${ .points >= 50 and .points < 80 }
            then: setSilver
        - bronze:
            when: ${ .points >= 20 and .points < 50 }
            then: setBronze
        - basic:
            then: setBasic
  - setGold:
      set:
        tier: gold
      then: exit
  - setSilver:
      set:
        tier: silver
      then: exit
  - setBronze:
      set:
        tier: bronze
      then: exit
  - setBasic:
      set:
        tier: basic
