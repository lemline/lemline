document:
  dsl: 1.0.3
  namespace: examples
  name: using-data-transformations-before-switching
  version: 1.0.0
do:
  - PrepareDecisionData:
      set:
        isNewCustomer: ${ (.customer.joinDate | fromdateiso8601) > (now - 30 * 24 * 3600) }
        isHighValue: ${ .order.total > 1000 }
        hasRiskyItems: ${ .order.items | map(select(.category == "restricted")) | length > 0 }
      then: RouteOrder
  - RouteOrder:
      switch:
        - case1:
            when: ${ .hasRiskyItems == true }
            then: ComplianceReview
        - case2:
            when: ${ .isNewCustomer == true and .isHighValue == true }
            then: VerificationProcess
        - case3:
            when: ${ .isHighValue == true }
            then: PriorityProcessing
        - case4:
            then: StandardProcessing
  - ComplianceReview:
      set:
        route: compliance
      then: end
  - VerificationProcess:
      set:
        route: verification
      then: end
  - PriorityProcessing:
      set:
        route: priority
      then: end
  - StandardProcessing:
      set:
        route: standard
      then: end
