document:
  dsl: '1.0.3'
  namespace: examples
  name: basic-switch-structure
  version: '1.0.0'
do:
  - checkTemperature:
      switch:
        - hot:
            when: ${ .temperature > 30 }
            then: coolWarehouse
        - cold:
            when: ${ .temperature < 10 }
            then: heatWarehouse
        - mild:
            then: keepSettings
  - coolWarehouse:
      set:
        action: cooling
      then: exit
  - heatWarehouse:
      set:
        action: heating
      then: exit
  - keepSettings:
      set:
        action: unchanged
