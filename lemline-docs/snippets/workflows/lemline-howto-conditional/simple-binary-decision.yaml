document:
  dsl: '1.0.3'
  namespace: examples
  name: simple-binary-decision
  version: '1.0.0'
do:
  - checkInventory:
      call: http
      with:
        method: get
        endpoint: ${ "http://127.0.0.1:8787/products/" + .productId }
      export:
        as: '${ $context + { requested: $workflow.input.quantity } }'
  - evaluateInventory:
      switch:
        - inStock:
            when: ${ .available >= $context.requested }
            then: processOrder
        - outOfStock:
            then: handleOutOfStock
  - processOrder:
      set:
        decision: process
      then: exit
  - handleOutOfStock:
      set:
        decision: backorder
