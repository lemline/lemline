document:
  dsl: 1.0.0
  namespace: examples
  name: star-wars-planets-batch
  version: 1.0.0-alpha2
do:
  - tryGetAllCharacters:
      try:
        - getAllCharacters:
            call: http
            with:
              method: get
              endpoint: https://swapi.dev/api/people/
      catch:
        errors:
          with:
            type: https://open-workflow-specification.org/spec/1.0.0/errors/communication
        retry:
          delay:
            seconds: 1
          backoff:
            exponential: { }
          limit:
            attempt:
              count: 3
