document:
  dsl: '1.0.3'
  namespace: examples
  name: product-lookup
  version: '1.0.0'
do:
  - findProduct:
      call: http
      with:
        method: get
        endpoint: http://127.0.0.1:8787/products
        query:
          search: ${ .search }
        output: response
      export:
        as:
          productId: ${ .content.items[0].id }
  - getProduct:
      call: http
      with:
        method: get
        endpoint: ${ "http://127.0.0.1:8787/products/" + $context.productId }
