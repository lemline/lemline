document:
  dsl: 1.0.3
  namespace: examples
  name: listen-to-any-example
  version: 0.1.0
do:
  - waitForEvent:
      listen:
        to:
          any:
            - with:
                type: order.created
            - with:
                type: order.cancelled
      timeout:
        after:
          seconds: 30
