document:
  dsl: '1.0.3'
  namespace: examples
  name: grpc-get-stock
  version: '0.1.0'
do:
  - getStock:
      call: grpc
      with:
        proto:
          endpoint: file:///opt/shop/inventory.proto
        service:
          name: shop.InventoryService
          host: localhost
          port: 50051
        method: GetStock
        arguments:
          sku: ${ .sku }
