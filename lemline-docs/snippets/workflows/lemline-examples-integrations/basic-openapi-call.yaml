document:
  dsl: '1.0.3'
  namespace: examples
  name: openapi-list-products
  version: '0.1.0'
do:
  - findGardenProducts:
      call: openapi
      with:
        document:
          endpoint: http://127.0.0.1:8787/openapi.json
        operationId: listProducts
        parameters:
          category: garden
