document:
  dsl: '1.0.3'
  namespace: examples
  name: http-with-oauth2
  version: '0.1.0'
use:
  secrets:
    - clientSecret
do:
  - getPartnerStock:
      call: http
      with:
        method: get
        endpoint:
          uri: http://127.0.0.1:8787/partner/stock
          authentication:
            oauth2:
              authority: http://127.0.0.1:8787
              endpoints:
                token: /oauth2/token
              grant: client_credentials
              client:
                id: shop-workflows
                secret: ${ $secrets.clientSecret }
