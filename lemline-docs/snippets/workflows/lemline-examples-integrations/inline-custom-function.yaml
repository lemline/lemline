document:
  dsl: '1.0.3'
  namespace: examples
  name: call-custom-function-inline
  version: '0.1.0'
use:
  functions:
    getProductById:
      input:
        schema:
          document:
            type: object
            properties:
              productId:
                type: string
            required: [ productId ]
      call: http
      with:
        method: get
        endpoint: '${ "http://127.0.0.1:8787/products/" + .productId }'
do:
  - getProduct:
      call: getProductById
      with:
        productId: SKU-2
