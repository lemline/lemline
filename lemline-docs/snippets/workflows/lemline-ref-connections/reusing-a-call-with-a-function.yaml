document:
  dsl: '1.0.3'
  namespace: examples
  name: reusing-a-call-with-a-function
  version: '1.0.0'
use:
  functions:
    getCustomer:
      do:
        - request:
            call: http
            with:
              method: get
              endpoint: ${ "http://127.0.0.1:8787/customers/" + .customerId }
do:
  - fetchCustomer:
      call: getCustomer
      with:
        customerId: ${ .id }
