document:
  dsl: '1.0.0'
  namespace: examples
  name: reusing-a-retry-policy
  version: '1.0.0'
use:
  retries:
    standard:
      delay:
        seconds: 2
      backoff:
        exponential: {}
      limit:
        attempt:
          count: 5
do:
  - fetchData:
      try:
        - callApi:
            call: http
            with:
              method: get
              endpoint: https://api.example.com/data
      catch:
        retry: standard
