document:
  dsl: '1.0.3'
  namespace: examples
  name: reusing-a-retry-policy
  version: '1.0.0'
use:
  retries:
    standard:
      delay:
        seconds: 2
      backoff:
        exponential: {}
      limit:
        attempt:
          count: 5
do:
  - fetchData:
      try:
        - callApi:
            call: http
            with:
              method: get
              endpoint: http://127.0.0.1:8787/stock
              query:
                fail: '503'
                failTimes: ${ .failures // 0 | tostring }
                key: ${ $workflow.id }
      catch:
        retry: standard
