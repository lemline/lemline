document:
  dsl: '1.0.3'
  namespace: examples
  name: try-retry-without-recovery
  version: '1.0.0'
do:
  - check:
      try:
        - reject:
            raise:
              error:
                type: https://open-workflow-specification.org/spec/1.0.0/errors/validation
                status: 400
                title: Invalid order
                detail: Missing order reference
      catch:
        retry:
          when: ${ .shouldRetry }
          delay: PT1S
          limit:
            attempt:
              count: 1
