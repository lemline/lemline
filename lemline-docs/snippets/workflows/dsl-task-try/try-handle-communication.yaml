document:
  dsl: '1.0.3'
  namespace: examples
  name: try-handle-communication
  version: '1.0.0'
do:
  - request:
      try:
        - readStock:
            call: http
            with:
              method: get
              endpoint: http://127.0.0.1:8787/stock
              query:
                fail: ${ .status | tostring }
                failTimes: ${ .failures | tostring }
                key: ${ .key }
      catch:
        errors:
          with:
            type: https://open-workflow-specification.org/spec/1.0.0/errors/communication
        as: apiError
        do:
          - fallback:
              set:
                status: ${ $apiError.status }
                source: fallback
