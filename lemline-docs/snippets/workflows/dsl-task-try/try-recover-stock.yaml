document:
  dsl: '1.0.3'
  namespace: examples
  name: try-recover-stock
  version: '1.0.0'
do:
  - request:
      try:
        - readStock:
            call: http
            with:
              method: get
              endpoint: http://127.0.0.1:8787/stock
              query:
                fail: ${ .status | tostring }
                failTimes: ${ .failures | tostring }
                key: ${ .key }
      catch:
        errors:
          with:
            type: https://open-workflow-specification.org/spec/1.0.0/errors/communication
            status: 503
        retry:
          delay: PT2S
          backoff:
            exponential: {}
          limit:
            attempt:
              count: 4
