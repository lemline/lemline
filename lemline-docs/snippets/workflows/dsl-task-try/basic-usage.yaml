document:
  dsl: 1.0.0
  namespace: examples
  name: try-catch-basic
  version: 1.0.0
do:
  - attemptServiceCall:
      try:
        - callMyApi:
            call: http
            with:
              method: get
              endpoint: https://api.unreliable.com/data
      catch:
        errors:
          with:
            type: https://open-workflow-specification.org/spec/1.0.0/errors/communication
        as: apiError
        do:
          - logFailure:
              call:
                https://raw.githubusercontent.com/open-workflow-specification/catalog/main/functions/log/1.0.0/function.yaml
              with:
                level: warn
                message: 'API call failed. Error: ${ $apiError }'
          - setDefaultValue:
              set:
                data:
                status: failed
  - continueProcessing:
      set:
        processed: true
