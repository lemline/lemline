document:
  dsl: '1.0.3'
  namespace: examples
  name: try-exclude-validation-field
  version: '1.0.0'
do:
  - check:
      try:
        - reject:
            raise:
              error:
                type: https://errors.example.com/invalid-order
                status: 400
                title: Invalid order
                detail: ${ .field }
      catch:
        errors:
          with:
            type: https://errors.example.com/invalid-order
        exceptWhen: ${ ($error.detail // $error.details) == "customerId" }
        do:
          - fallback:
              set:
                result: rejected
