document:
  dsl: 1.0.0
  namespace: examples
  name: listen-for-vitals
  version: 1.0.0
do:
  - startMonitoring:
      set:
        processed: true
  - waitForVitalSignAlert:
      listen:
        to:
          any:
            - with:
                source: http://vitals-service
                type: com.fake-hospital.vitals.measurements.temperature
                data: ${ .temperature > 38 }
            - with:
                source: http://vitals-service
                type: com.fake-hospital.vitals.measurements.bpm
                data: ${ .bpm < 60 or .bpm > 100 }
        read: data
      timeout:
        after: PT1H
      then: processAlert
  - processAlert:
      set:
        processed: true
