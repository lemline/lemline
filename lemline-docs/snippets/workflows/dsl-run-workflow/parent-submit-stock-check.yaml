document:
  dsl: '1.0.3'
  namespace: examples
  name: parent-submit-stock-check
  version: '1.0.0'
do:
  - submit:
      run:
        workflow:
          namespace: examples
          name: child-stock-check
          version: '1.0.0'
          input:
            quantity: ${ .quantity }
        await: false
  - acknowledge:
      set:
        submittedQuantity: ${ .quantity }
