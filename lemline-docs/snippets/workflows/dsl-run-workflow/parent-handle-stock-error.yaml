document:
  dsl: '1.0.3'
  namespace: examples
  name: parent-handle-stock-error
  version: '1.0.0'
do:
  - attempt:
      try:
        - checkStock:
            run:
              workflow:
                namespace: examples
                name: child-stock-check
                version: '1.0.0'
                input:
                  quantity: ${ .quantity }
      catch:
        errors:
          with:
            type: https://errors.example.com/invalid-stock-quantity
        as: invalid
        do:
          - report:
              set:
                status: ${ $invalid.status }
                reason: ${ $invalid.title }
