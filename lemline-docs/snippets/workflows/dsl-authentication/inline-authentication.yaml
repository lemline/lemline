document:
  dsl: '1.0.0'
  namespace: examples
  name: inline-authentication
  version: '1.0.0'
use:
  secrets:
    - tempPassword
do:
  - callServiceWithInlineAuth:
      call: http
      with:
        method: get
        endpoint:
          uri: https://onetime-service.example.com/resource
          # Define authentication directly here
          authentication:
            basic:
              username: temp_user
              password: ${ $secrets.tempPassword }
