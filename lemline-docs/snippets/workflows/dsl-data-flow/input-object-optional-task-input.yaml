document:
  dsl: '1.0.3'
  namespace: examples
  name: input-object-optional-task-input
  version: '1.0.0'
do:
  - double:
      input:
        from: ${ .data }
        schema:
          format: json
          document:
            type: object
            required: [data]
            properties:
              data:
                type: object
                required: [value]
                properties:
                  value: { type: number }
      set:
        doubled: ${ $input.value * 2 }
