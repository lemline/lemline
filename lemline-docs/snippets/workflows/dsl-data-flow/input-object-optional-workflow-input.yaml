document:
  dsl: '1.0.3'
  namespace: examples
  name: input-object-optional-workflow-input
  version: '1.0.0'
input:
  from: '${ {customerId: .customer.id, count: .quantity} }'
  schema:
    format: json
    document:
      type: object
      required: [customer, quantity]
      properties:
        customer:
          type: object
          required: [id]
          properties:
            id: { type: string }
        quantity: { type: integer, minimum: 1 }
do:
  - acknowledge:
      set:
        customerId: ${ .customerId }
        units: ${ .count }
