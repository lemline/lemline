document:
  dsl: '1.0.3'
  namespace: examples
  name: output-object-optional-task-output
  version: '1.0.0'
do:
  - readCustomer:
      call: http
      with:
        method: get
        endpoint: '${ "http://127.0.0.1:8787/customers/" + (.customerId | @uri) }'
      output:
        as: '${ {customerId: .id} }'
        schema:
          format: json
          document:
            type: object
            required: [customerId]
            properties:
              customerId: { type: string }
  - acknowledge:
      set:
        identifiedCustomer: ${ .customerId }
