document:
  dsl: '1.0.3'
  namespace: examples
  name: export-object-optional
  version: '1.0.0'
do:
  - readCustomer:
      call: http
      with:
        method: get
        endpoint: '${ "http://127.0.0.1:8787/customers/" + (.customerId | @uri) }'
      export:
        as: '${ $context + {lastCustomerId: .id} }'
        schema:
          format: json
          document:
            type: object
            required: [lastCustomerId]
            properties:
              lastCustomerId: { type: string }
  - discardCustomerDetails:
      set:
        action: processed
  - summarize:
      set:
        action: ${ .action }
        customerId: ${ $context.lastCustomerId }
