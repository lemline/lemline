document:
  dsl: 1.0.0
  namespace: examples
  name: output-transformation
  version: 1.0.0
do:
  - ProcessApiResponse:
      call: userService
      output:
        as:
          user: ${ .data.user }
          permissions: ${ .data.permissions | map(.name) }
          isAdmin: ${ .data.permissions | map(.name) | contains(["ADMIN"]) }
      then: NextTask
