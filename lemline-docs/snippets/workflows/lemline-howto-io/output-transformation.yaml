document:
  dsl: '1.0.3'
  namespace: examples
  name: output-transformation
  version: '1.0.0'
do:
  - getCustomer:
      call: http
      with:
        method: get
        endpoint: ${ "http://127.0.0.1:8787/customers/" + .customerId }
      output:
        as:
          customer: ${ .name }
          tier: ${ .tier }
          isGold: ${ .tier == "gold" }
