document:
  dsl: 1.0.3
  namespace: examples
  name: order-processing
  version: 1.0.0
  title: Order Processing Workflow
input:
  schema:
    document:
      type: object
      required:
        - orderId
        - customerId
        - items
      properties:
        orderId:
          type: string
          pattern: ^ORD-[0-9]{6}$
        customerId:
          type: string
        items:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - productId
              - quantity
            properties:
              productId:
                type: string
              quantity:
                type: integer
                minimum: 1
do:
  - example:
      set:
        ready: true
