document:
  dsl: '1.0.3'
  namespace: examples
  name: basic-export
  version: '1.0.0'
do:
  - fetchCustomerData:
      call: http
      with:
        method: get
        endpoint: ${ "http://127.0.0.1:8787/customers/" + .customerId }
      export:
        as:
          customer: ${ . }
  - greetCustomer:
      set:
        greeting: ${ "Hello " + $context.customer.name }
