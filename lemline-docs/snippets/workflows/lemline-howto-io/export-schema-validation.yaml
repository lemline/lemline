document:
  dsl: 1.0.0
  namespace: examples
  name: export-schema-validation
  version: 1.0.0
do:
  - ValidateExportedData:
      call: dataService
      with:
        id: ${ .entityId }
      export:
        as:
          validatedEntity: .
        schema:
          document:
            type: object
            required:
              - validatedEntity
            properties:
              validatedEntity:
                type: object
                required:
                  - id
                  - name
                  - status
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  status:
                    type: string
                    enum:
                      - ACTIVE
                      - INACTIVE
                      - PENDING
      then: NextTask
