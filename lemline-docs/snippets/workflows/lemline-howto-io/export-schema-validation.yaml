document:
  dsl: '1.0.3'
  namespace: examples
  name: io-export-schema-validation
  version: '1.0.0'
do:
  - validateExportedData:
      call: http
      with:
        method: get
        endpoint: ${ "http://127.0.0.1:8787/products/" + .productId }
      export:
        as:
          validatedProduct: ${ . }
        schema:
          document:
            type: object
            required:
              - validatedProduct
            properties:
              validatedProduct:
                type: object
                required:
                  - id
                  - name
                  - category
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  category:
                    type: string
                    enum:
                      - garden
                      - home
  - showContext:
      set:
        context: ${ $context }
