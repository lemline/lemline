document:
  dsl: 1.0.3
  namespace: examples
  name: accessing-workflow-input
  version: 1.0.0
do:
  - ProcessOrder:
      set:
        orderId: ${ $workflow.input.orderId }
        customerId: ${ $workflow.input.customerId }
        items: ${ $workflow.input.items }
        timestamp: ${ (now | todateiso8601) }
      then: NextTask
