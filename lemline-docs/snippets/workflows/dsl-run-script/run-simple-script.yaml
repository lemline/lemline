document:
  dsl: '1.0.3'
  namespace: examples
  name: run-simple-script
  version: '1.0.0'
do:
  - executeScript:
      run:
        script:
          language: js
          code: |
            const [, , name, value] = process.argv;
            if (name === "orderId") console.log("Received " + value);
          arguments:
            orderId: ${ .orderId }
        return: stdout
