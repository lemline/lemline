document:
  dsl: 1.0.3
  namespace: examples
  name: example-returning-exit-code
  version: 1.0.0
do:
  - checkDataIntegrity:
      run:
        script:
          language: js
          code: |
            // Script exits with 0 on success, 1 on failure
            const isValid = checkData($input.data);
            process.exit(isValid ? 0 : 1);
          arguments:
            input: ${ . }
        return: code
      then: handleIntegrityCheck
  - handleIntegrityCheck:
      switch:
        - case1:
            when: ${ . == 0 }
            then: dataIsValid
        - case2:
            then: dataIsInvalid
