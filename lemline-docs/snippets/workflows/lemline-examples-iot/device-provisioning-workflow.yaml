document:
  dsl: '1.0.3'
  namespace: examples
  name: device-provisioning
  version: '1.0.0'
input:
  schema:
    format: json
    document:
      type: object
      required:
        - deviceId
        - deviceType
        - location
      properties:
        deviceId:
          type: string
        deviceType:
          type: string
          enum:
            - sensor
            - gateway
            - controller
        location:
          type: object
          required:
            - siteId
            - zone
do:
  - validateDevice:
      try:
        - checkDeviceExists:
            call: http
            with:
              method: get
              endpoint: ${ "http://127.0.0.1:8787/devices/\(.deviceId)" }
      catch:
        errors:
          with:
            type: https://open-workflow-specification.org/spec/1.0.0/errors/communication
            status: 404
        as: notFoundError
        do:
          - createDeviceRecord:
              call: http
              with:
                method: post
                endpoint: http://127.0.0.1:8787/devices
                body:
                  deviceId: ${ .deviceId }
                  deviceType: ${ .deviceType }
                  location: ${ .location }
                  status: provisioning
              export:
                as: '${ $context + { deviceRegistry: . } }'
  - generateCredentials:
      try:
        - createCredentials:
            call: http
            with:
              method: post
              endpoint: ${ "http://127.0.0.1:8787/devices/\($workflow.input.deviceId)/credentials" }
            export:
              as: '${ $context + { credentials: . } }'
      catch:
        errors:
          with:
            type: https://open-workflow-specification.org/spec/1.0.0/errors/communication
        retry:
          delay:
            seconds: 5
          limit:
            attempt:
              count: 3
  - configureDevice:
      call: http
      with:
        method: patch
        endpoint: ${ "http://127.0.0.1:8787/devices/\($workflow.input.deviceId)" }
        body:
          config:
            reportingIntervalSeconds: 60
            zone: ${ $workflow.input.location.zone }
      export:
        as: '${ $context + { deviceConfig: .config } }'
  - activateDevice:
      emit:
        event:
          with:
            type: com.example.iot.device.activation.requested
            source: https://events.example.com/warehouse
            data:
              deviceId: ${ $workflow.input.deviceId }
              config: ${ $context.deviceConfig }
  - waitForDeviceActivation:
      listen:
        to:
          one:
            with:
              type: com.example.iot.device.activated
            correlate:
              deviceId:
                from: ${ .deviceId }
                expect: ${ $workflow.input.deviceId }
      timeout:
        after:
          minutes: 15
  - finalizeProvisioning:
      call: http
      with:
        method: patch
        endpoint: ${ "http://127.0.0.1:8787/devices/\($workflow.input.deviceId)" }
        body:
          status: active
          lastPing: ${ .[0].timestamp }
