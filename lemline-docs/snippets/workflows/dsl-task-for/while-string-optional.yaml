document:
  dsl: '1.0.3'
  namespace: examples
  name: while-string-optional
  version: '1.0.0'
do:
  - takeNumbers:
      for:
        in: ${ .numbers }
      while: ${ .remaining > 0 }
      do:
        - take:
            set:
              value: ${ $item }
              remaining: ${ .remaining - 1 }
