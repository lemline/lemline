document:
  dsl: 1.0.0
  namespace: examples
  name: do-list-string-object-required
  version: 1.0.0
do:
  - example:
      for:
        in: ${ .products }
        each: product
      do:
        - checkStock:
            call: inventoryService
            with:
              productId: ${ $product.id }
        - updatePrice:
            set:
              processed: true
