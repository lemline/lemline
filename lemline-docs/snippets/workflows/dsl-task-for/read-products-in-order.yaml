document:
  dsl: '1.0.3'
  namespace: examples
  name: read-products-in-order
  version: '1.0.0'
do:
  - lookup:
      for:
        in: ${ .products }
        each: product
      do:
        - readProduct:
            call: http
            with:
              method: get
              endpoint: '${ "http://127.0.0.1:8787/products/" + $product.id }'
        - selectId:
            set:
              productId: ${ .id }
