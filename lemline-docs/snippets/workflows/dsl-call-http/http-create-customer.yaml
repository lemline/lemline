document:
  dsl: '1.0.3'
  namespace: examples
  name: http-create-customer
  version: '1.0.0'
do:
  - createCustomer:
      call: http
      with:
        method: post
        endpoint: http://127.0.0.1:8787/customers
        query:
          source: workflow
        headers:
          Content-Type: application/json
        body:
          name: ${ .name }
          email: ${ .email }
  - confirm:
      set:
        customerId: ${ .id }
        name: ${ .name }
