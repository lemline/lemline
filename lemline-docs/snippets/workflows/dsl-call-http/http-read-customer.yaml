document:
  dsl: '1.0.3'
  namespace: examples
  name: http-read-customer
  version: '1.0.0'
do:
  - lookUpCustomer:
      call: http
      with:
        method: get
        endpoint: '${ "http://127.0.0.1:8787/customers/" + (.customerId | @uri) }'
        headers:
          Accept: application/json
  - selectCustomer:
      set:
        customerId: ${ .id }
        name: ${ .name }
