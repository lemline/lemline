document:
  dsl: 1.0.3
  namespace: examples
  name: using-retry-policies
  version: 1.0.0
do:
  - readStock:
      try:
        - operation:
            call: http
            with:
              method: get
              endpoint: http://127.0.0.1:8787/stock
              query:
                fail: '503'
                failTimes: '1'
                key: ${ $workflow.id }
      catch:
        retry:
          delay:
            seconds: 1
          backoff:
            exponential: {}
          limit:
            attempt:
              count: 3
          when: ${ $error.status >= 500 }
