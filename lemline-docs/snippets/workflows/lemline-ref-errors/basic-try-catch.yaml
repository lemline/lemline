document:
  dsl: 1.0.0
  namespace: examples
  name: basic-try-catch
  version: 1.0.0
do:
  - secureOperation:
      try:
        - riskyTask:
            set:
              processed: true
      catch:
        errors:
          with:
            type: https://open-workflow-specification.org/spec/1.0.0/errors/timeout
        as: timeoutError
        do:
          - handleTimeout:
              set:
                processed: true
