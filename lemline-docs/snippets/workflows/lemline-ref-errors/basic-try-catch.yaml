document:
  dsl: 1.0.3
  namespace: examples
  name: basic-try-catch
  version: 1.0.0
do:
  - secureOperation:
      try:
        - riskyTask:
            listen:
              to:
                one:
                  with:
                    type: com.example.payment.received
            timeout:
              after:
                seconds: 5
      catch:
        errors:
          with:
            type: https://open-workflow-specification.org/spec/1.0.0/errors/timeout
        as: timeoutError
        do:
          - handleTimeout:
              set:
                processed: false
                reason: ${ $timeoutError.title }
