document:
  dsl: '1.0.3'
  namespace: examples
  name: output-transformation-and-validation
  version: '1.0.0'
do:
  - findProducts:
      call: http
      with:
        method: get
        endpoint: http://127.0.0.1:8787/products
        query:
          category: ${ .category }
      output:
        as: '${ if (.items | length) > 0 then { status: "SUCCESS", data: { items: [.items[].id] } } else { status: "ERROR", error: { message: "No products in this category" } } end }'
        schema:
          document:
            type: object
            required:
              - status
            properties:
              status:
                type: string
                enum:
                  - SUCCESS
                  - ERROR
              data:
                type: object
                if:
                  properties:
                    status:
                      const: SUCCESS
                  required:
                    - status
                then:
                  required:
                    - data
              error:
                type: object
                if:
                  properties:
                    status:
                      const: ERROR
                  required:
                    - status
                then:
                  required:
                    - error
