document:
  dsl: 1.0.0
  namespace: examples
  name: output-transformation-and-validation
  version: 1.0.0
do:
  - ProcessAPIResponse:
      call: externalAPI
      with:
        endpoint: /data
        parameters: ${ .queryParams }
      output:
        schema:
          document:
            type: object
            required:
              - status
            properties:
              status:
                type: string
                enum:
                  - SUCCESS
                  - ERROR
              data:
                type: object
                if:
                  properties:
                    status:
                      const: SUCCESS
                  required:
                    - status
                then:
                  required:
                    - data
              error:
                type: object
                if:
                  properties:
                    status:
                      const: ERROR
                  required:
                    - status
                then:
                  required:
                    - error
      then: HandleResult
