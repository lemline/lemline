document:
  dsl: '1.0.3'
  namespace: examples
  name: export-schema-validation
  version: '1.0.0'
do:
  - fetchCustomerData:
      call: http
      with:
        method: get
        endpoint: ${ "http://127.0.0.1:8787/customers/" + .customerId }
      export:
        as:
          customer: ${ . }
        schema:
          document:
            type: object
            required:
              - customer
            properties:
              customer:
                type: object
                required:
                  - id
                  - name
                  - email
                  - tier
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  email:
                    type: string
                    format: email
                  tier:
                    type: string
                    enum:
                      - gold
                      - standard
  - greetCustomer:
      set:
        greeting: ${ "Hello " + $context.customer.name }
