document:
  dsl: '1.0.3'
  namespace: examples
  name: validating-task-input
  version: '1.0.0'
do:
  - requestPayment:
      call: http
      with:
        method: post
        endpoint: http://127.0.0.1:8787/audit
        body:
          reference: ${ .paymentMethod.token }
          message: '${ "Payment of \(.amount) \(.currency) requested" }'
      input:
        schema:
          document:
            type: object
            required:
              - amount
              - currency
              - paymentMethod
            properties:
              amount:
                type: number
                exclusiveMinimum: 0
              currency:
                type: string
                enum:
                  - USD
                  - EUR
                  - GBP
              paymentMethod:
                type: object
                required:
                  - type
                  - token
                properties:
                  type:
                    type: string
                    enum:
                      - CREDIT_CARD
                      - PAYPAL
                      - BANK_TRANSFER
                  token:
                    type: string
