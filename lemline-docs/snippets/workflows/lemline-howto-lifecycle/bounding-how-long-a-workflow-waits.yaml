document:
  dsl: '1.0.3'
  namespace: examples
  name: bounding-how-long-a-workflow-waits
  version: '1.0.0'
do:
  - waitForPayment:
      try:
        - listenForPayment:
            listen:
              to:
                one:
                  with:
                    type: com.example.payment.received
            timeout:
              after:
                seconds: 30
      catch:
        errors:
          with:
            type: https://open-workflow-specification.org/spec/1.0.0/errors/timeout
        do:
          - markExpired:
              set:
                status: expired
