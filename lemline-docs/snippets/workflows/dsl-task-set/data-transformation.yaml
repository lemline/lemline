document:
  dsl: '1.0.3'
  namespace: examples
  name: data-transformation
  version: '1.0.0'
do:
  - getCustomer:
      call: http
      with:
        method: get
        endpoint: '${ "http://127.0.0.1:8787/customers/" + .customerId }'
      export:
        as: '${ $context + {customer: .} }'
  - transformProfile:
      set:
        profile:
          displayName: ${ $context.customer.name }
          email: ${ $context.customer.email }
          canContact: ${ $context.customer.emailValid }
