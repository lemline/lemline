document:
  dsl: 1.0.0
  namespace: examples
  name: data-transformation
  version: 1.0.0
do:
  - retrieveUserData:
      call: userService
      with:
        userId: ${ .input.userId }
      export:
        as: '${ $context + { userData: . } }'
  - transformUserProfile:
      set:
        profile:
          displayName: ${ $context.userData.firstName + " " + $context.userData.lastName }
          email: ${ $context.userData.email }
          joined: '${ ($context.userData.createdTimestamp | split("T")[0]) }'
          membershipLevel: '${ if $context.userData.totalPurchases > 10000 then "platinum" elif $context.userData.totalPurchases
            > 5000 then "gold" elif $context.userData.totalPurchases > 1000 then "silver" else "standard" end }'
          tags: '${ $context.userData.interests // [] }'
