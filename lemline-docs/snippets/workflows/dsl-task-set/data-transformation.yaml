document:
  dsl: 1.0.0
  namespace: examples
  name: data-transformation
  version: 1.0.0
do:
  - retrieveUserData:
      call: userService
      with:
        userId: ${ .input.userId }
      export:
        as: '${ $context + { userData: . } }'
  - transformUserProfile:
      set:
        profile:
          displayName: ${ .userData.firstName + " " + .userData.lastName }
          email: ${ .userData.email }
          joined: '${ (.userData.createdTimestamp | split("T")[0]) }'
          membershipLevel: '${ if .userData.totalPurchases > 10000 then "platinum" elif .userData.totalPurchases
            > 5000 then "gold" elif .userData.totalPurchases > 1000 then "silver" else "standard" end }'
          tags: '${ .userData.interests // [] }'
