document:
  dsl: '1.0.0'
  namespace: examples
  name: json-path-examples
  version: '1.0.0'
do:
  - manipulateData:
      set:
        # Access nested properties
        customerEmail: ${ .input.order.customer.contactInfo.email }

        # Array operations
        firstItem: ${ .input.items[0] }
        itemCount: ${ .input.items | length }

        # Filtering arrays
        expensiveItems: '${ [.input.products[] | select(.price > 100)] }'

        # Mapping arrays
        productNames: '${ [.input.products[].name] }'

        # Combining data
        combinedList: ${ .list1 + .list2 }

        # Conditional assignment
        status: '${ if .input.approved then "APPROVED" else "PENDING" end }'

        # String operations
        upperCaseName: ${ .input.name | ascii_upcase }
        formattedId: '${ .input.id | tostring | ("0" * (10 - length)) + . }'
