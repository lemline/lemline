document:
  dsl: 1.0.3
  namespace: examples
  name: switch-basic
  version: 1.0.0
do:
  - decideNextStep:
      switch:
        - caseApproved:
            when: ${ .status == "Approved" }
            then: processApproved
        - caseRejected:
            when: ${ .status == "Rejected" }
            then: processRejected
        - caseDefault:
            then: handleOtherStatus
  - processApproved:
      set:
        route: approved
      then: exit
  - processRejected:
      set:
        route: rejected
      then: exit
  - handleOtherStatus:
      set:
        route: manual-review
