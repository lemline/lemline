document:
  dsl: 1.0.0
  namespace: examples
  name: raise-basic
  version: 1.0.0
use:
  errors:
    invalidInputError:
      type: https://mycompany.com/errors/invalid-input
      title: Invalid Input Received
      status: 400
do:
  - validateInput:
      raise:
        error: invalidInputError
      if: ${ .value < 0 }
  - processValue:
      set:
        processed: true
