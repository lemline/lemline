document:
  dsl: 1.0.3
  namespace: tutorial
  name: acknowledge-order
  version: '0.1.2'
input:
  schema:
    document:
      type: object
      required: [orderId]
      properties:
        orderId:
          type: string
do:
  - acknowledge:
      set:
        message: ${ "Order received for " + .orderId + "!" }
