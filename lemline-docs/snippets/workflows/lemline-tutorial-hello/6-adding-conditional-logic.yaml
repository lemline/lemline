document:
  dsl: 1.0.0
  namespace: tutorial
  name: hello-workflow
  version: 0.1.0
input:
  schema:
    document:
      type: object
      properties:
        name:
          type: string
        hour:
          type: integer
do:
  - chooseGreeting:
      switch:
        - case1:
            when: ${ .hour < 12 }
            then: setMorningGreeting
        - case2:
            when: ${ .hour < 18 }
            then: setAfternoonGreeting
        - case3:
            then: setEveningGreeting
  - setMorningGreeting:
      set:
        greeting: Good morning
      then: createMessage
  - setAfternoonGreeting:
      set:
        greeting: Good afternoon
      then: createMessage
  - setEveningGreeting:
      set:
        greeting: Good evening
  - createMessage:
      set:
        message: ${ .greeting + ", " + $workflow.input.name + "!" }
  - logMessage:
      call:
        https://raw.githubusercontent.com/open-workflow-specification/catalog/main/functions/log/1.0.0/function.yaml
      with:
        message: ${ .message }
