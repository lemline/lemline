document:
  dsl: 1.0.3
  namespace: tutorial
  name: acknowledge-order
  version: '0.1.3'
input:
  schema:
    document:
      type: object
      required: [orderId, hour]
      properties:
        orderId:
          type: string
        hour:
          type: integer
do:
  - chooseGreeting:
      switch:
        - case1:
            when: ${ .hour < 12 }
            then: setMorningGreeting
        - case2:
            when: ${ .hour < 18 }
            then: setAfternoonGreeting
        - case3:
            then: setEveningGreeting
  - setMorningGreeting:
      set:
        greeting: Good morning
      then: createMessage
  - setAfternoonGreeting:
      set:
        greeting: Good afternoon
      then: createMessage
  - setEveningGreeting:
      set:
        greeting: Good evening
  - createMessage:
      set:
        message: '${ .greeting + ": order received for " + $workflow.input.orderId + "!" }'
