document:
  dsl: '1.0.3'
  namespace: examples
  name: read-expression-scope
  version: '1.0.0'
do:
  - normalize:
      set:
        count: ${ .count + 1 }
      export:
        as: '${ {order: $workflow.input.orderId} }'
  - showScope:
      set:
        orderId: ${ $context.order }
        adjustedCount: ${ .count }
        originalCount: ${ $workflow.input.count }
