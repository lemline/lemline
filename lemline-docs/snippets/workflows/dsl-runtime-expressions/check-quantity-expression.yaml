document:
  dsl: '1.0.3'
  namespace: examples
  name: check-quantity-expression
  version: '1.0.0'
do:
  - convertQuantity:
      try:
        - parse:
            set:
              quantity: ${ .quantity | tonumber }
      catch:
        as: problem
        do:
          - reject:
              set:
                status: ${ $problem.status }
                type: ${ $problem.type }
